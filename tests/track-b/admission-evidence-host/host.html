<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#101820;color:white;font:16px system-ui}header{padding:12px;background:#512810}canvas{display:block}#state{padding:8px}</style></head><body><header>CANDIDATE EVIDENCE ONLY / NOT ADMITTED / NO REALISTIC MESH OR GAMEPLAY CAMERA CLAIM</header><div id="state">Loading exact source bindings</div><script type="module">
import * as THREE from '/vendor/three.module.js';
const data=await(await fetch('/bindings')).json(),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,1200/700,.1,40),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(1200,700);scene.background=new THREE.Color(0x17202b);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x333333,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-4,7,5);scene.add(sun);
const meshes=new Map(),M=1e6;
function box(bounds,color,id){const size=['X','Y','Z'].map(a=>(bounds['max'+a]-bounds['min'+a])/M),center=['X','Y','Z'].map(a=>(bounds['max'+a]+bounds['min'+a])/(2*M)),mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),new THREE.MeshStandardMaterial({color,roughness:.8}));mesh.position.set(...center);mesh.userData.authoritativeId=id;scene.add(mesh);return mesh}
for(const s of data.surfaces){if(s.type==='FLOOR'){for(const a of s.region.allowed){const geo=new THREE.PlaneGeometry(a.maxX-a.minX,a.maxZ-a.minZ),mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x63766a,side:THREE.DoubleSide}));mesh.rotation.x=-Math.PI/2;mesh.position.set((a.minX+a.maxX)/2,s.planeOrDepth.planeY,(a.minZ+a.maxZ)/2);scene.add(mesh)}}else for(const v of s.region.volumes)box(Object.fromEntries(Object.entries(v).filter(([k])=>k!=='volumeId').map(([k,x])=>[k,x*M])),s.type==='DOOR_OR_OPENING'?0x996631:s.type==='WALL'?0x537287:0x456682,s.surfaceId)}
const colors=[0xffcc88,0x55aaff,0xff77aa,0xafffaa];for(const [i,e] of data.entities.entries()){const mesh=box(e.bounds,colors[i],e.entityId),root=new THREE.Group();scene.remove(mesh);root.add(mesh);root.position.fromArray(e.transform.positionMicrounits.map(x=>x/M));root.quaternion.fromArray(e.transform.orientation);root.scale.fromArray(e.transform.scaleMicrounits.map(x=>x/M));scene.add(root);meshes.set(e.entityId,root)}
const transformState=()=>[...meshes].map(([id,m])=>({entityId:id,position:m.position.toArray(),orientation:m.quaternion.toArray(),scale:m.scale.toArray()}));
window.evidence={bindings:data,frames:[],renderCount:0,show:async (id,options={})=>{const gate=await(await fetch('/camera',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,...options})})).json();if(!gate.renderAllowed){document.querySelector('#state').textContent='BLOCKED '+JSON.stringify(gate);return gate}camera.position.fromArray(gate.transform.positionMicrounits.map(x=>x/M));camera.quaternion.fromArray(gate.transform.orientation);camera.near=gate.transform.nearPlaneMicrounits/M;camera.updateProjectionMatrix();camera.updateMatrixWorld();renderer.render(scene,camera);window.evidence.renderCount++;const frame={id,gate,entityTransforms:transformState(),projectedBounds:[...meshes].map(([entityId,m])=>{const box=new THREE.Box3().setFromObject(m),points=[];for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z]){const p=new THREE.Vector3(x,y,z).project(camera);points.push([(p.x+1)*600,(1-p.y)*350])}return {entityId,worldBounds:{min:box.min.toArray(),max:box.max.toArray()},pixelBounds:[Math.min(...points.map(p=>p[0])),Math.min(...points.map(p=>p[1])),Math.max(...points.map(p=>p[0])),Math.max(...points.map(p=>p[1]))]}}),projectedCenters:[...meshes].map(([entityId,m])=>{const v=new THREE.Vector3().setFromMatrixPosition(m.matrixWorld).project(camera);return {entityId,ndc:v.toArray(),pixel:[(v.x+1)*600,(1-v.y)*350]}})};window.evidence.frames.push(frame);document.querySelector('#state').textContent=id+' | exact world '+data.worldDigest+' | geometric component clear, admission PENDING';return frame}};
window.evidence.idPass=()=>{const saved=[];scene.traverse(o=>{if(o.isMesh){saved.push([o,o.material]);o.material=new THREE.MeshBasicMaterial({color:o.userData.authoritativeId?.startsWith('school-')?(o.userData.authoritativeId==='school-casualty-adult-v1'?0xff0000:o.userData.authoritativeId==='school-medical-bag'?0x00ff00:0x0000ff):0x000000,side:THREE.DoubleSide})}});renderer.render(scene,camera);for(const [o,m] of saved)o.material=m;return true};
 document.body.dataset.ready='true';
</script></body></html>
