<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C4 real-hardware FPS harness - named physical devices only</title>
<style>
body{margin:0;background:#0b1114;color:#cfe3ee;font:14px/1.6 system-ui}
#panel{position:fixed;top:0;left:0;right:0;padding:12px 16px;background:rgba(10,16,20,.95);border-bottom:2px solid #b8892d;z-index:5}
input,button{font:inherit;padding:6px 10px;margin:2px}
#out{white-space:pre-wrap;background:#101a20;border:1px solid #2a3f4a;padding:10px;margin-top:10px;font-family:monospace;font-size:12px;max-height:40vh;overflow:auto}
.warn{color:#ffd27f;font-weight:bold}
</style></head><body>
<div id="panel">
<b>C4 - מדידת FPS על חומרה פיזית בלבד.</b>
<span class="warn">מספרים תקפים רק למכשיר הפיזי הנקוב. תוצאה מאמולטור/דפדפן מדומה/האטת DevTools היא לא חוקית ואסור לדווח אותה.</span><br>
<input id="deviceId" placeholder="שם מכשיר מדויק (חובה) - למשל: iPhone 15 Pro של יוני" size="42">
<input id="os" placeholder="מערכת הפעלה" size="14">
<input id="browser" placeholder="דפדפן" size="14">
<label><input type="checkbox" id="attest"> אני מאשר שהמדידה על מכשיר פיזי אמיתי, ללא אמולציה</label>
<button id="start" disabled>התחל מדידה (600 פריימים)</button>
<span id="status"></span>
<div id="out" dir="ltr"></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import * as ENGINE from './engine-bundle.js';
import {buildArticulatedLayout} from './articulated-layout.mjs';
import {fitCameraToAabb} from './camera-lighting.mjs';
import {createPerfHarness,WINDOW_FRAMES} from './perf-harness.mjs';
const U=1e6,m=v=>v/U;
const statusEl=document.getElementById('status'),out=document.getElementById('out'),startBtn=document.getElementById('start');
// Same certified engine bundle, read-only, same fail-closed anchors as the demo.
const live=ENGINE.buildVisualSceneDescriptor();
const fail=t=>{statusEl.textContent='ENGINE FAIL-CLOSED: '+t;throw new Error(t)};
if(!live||live.status!=='COMMITTED')fail('descriptor');
if(live.sourcePackage.scenePackageDigest!==ENGINE.EXPECTED.packageDigest)fail('package digest');
if(live.worldRef.stateDigest!==ENGINE.EXPECTED.worldDigest)fail('world digest');
if(live.worldRef.replayMatchesCommittedState!==true)fail('replay');
if(live.descriptorDigest!==ENGINE.EXPECTED.nodeDescriptorDigest)fail('descriptor digest');
const bundle=await (await fetch('./scene-bundle.json')).json();
const liveCasualty=ENGINE.buildVisualCasualty(live),liveEquipment=ENGINE.buildVisualEquipment(live);
if(!liveCasualty||liveCasualty.visualDigest!==bundle.inputs.casualtyDigest)fail('casualty');
if(!liveEquipment||liveEquipment.visualDigest!==bundle.inputs.equipmentDigest)fail('equipment');
// Same scene as the demo (measurement target), minus demo chrome.
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101a20);
const camera=new THREE.PerspectiveCamera(bundle.camera.fovDegrees,innerWidth/innerHeight,.05,120);
const envU=bundle.casualty.worldEnvelopeMicrounits;
const casualtyEnv=Object.fromEntries(Object.entries(envU).map(([k,v])=>[k,m(v)]));
const fit=fitCameraToAabb(casualtyEnv,bundle.camera.positionMicrounits.map(m),bundle.camera.lookAtMicrounits.map(m),bundle.camera.fovDegrees,innerWidth/innerHeight,0.08);
camera.position.set(...fit.position);camera.updateProjectionMatrix();
const box=(aabb,c)=>{const sx=m(aabb.maxX-aabb.minX),sy=m(aabb.maxY-aabb.minY),sz=m(aabb.maxZ-aabb.minZ);
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:parseInt(c),roughness:.85}));
 mesh.position.set(m(aabb.minX)+sx/2,m(aabb.minY)+sy/2,m(aabb.minZ)+sz/2);return mesh};
for(const s of bundle.room)scene.add(box(s.geometryMicrounits,s.visualOnlyClaims.colorHex));
function partMesh(part,colorHex){let g;
 if(part.shape==='sphere')g=new THREE.SphereGeometry(m(part.radius),28,20);
 else if(part.shape==='capsuleZ'||part.shape==='capsuleY')g=new THREE.CapsuleGeometry(m(part.radius),m(part.cylinderLength),8,20);
 else g=new THREE.BoxGeometry(m(part.aabb.maxX-part.aabb.minX),m(part.aabb.maxY-part.aabb.minY),m(part.aabb.maxZ-part.aabb.minZ));
 const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:parseInt(part.colorHex||colorHex),roughness:.65}));
 if(part.shape==='capsuleZ')mesh.rotation.x=Math.PI/2;
 if(part.shape==='box')mesh.position.set(m((part.aabb.minX+part.aabb.maxX)/2),m((part.aabb.minY+part.aabb.maxY)/2),m((part.aabb.minZ+part.aabb.maxZ)/2));
 else mesh.position.set(...part.center.map(m));return mesh}
const layout=buildArticulatedLayout(liveCasualty,liveEquipment);
for(const g of [...layout.casualty,...layout.chair,...layout.bag])for(const part of g.parts)scene.add(partMesh(part,g.colorHex));
scene.add(new THREE.AmbientLight(parseInt(bundle.lighting.ambient.colorHex),bundle.lighting.ambient.intensity));
const key=new THREE.DirectionalLight(parseInt(bundle.lighting.key.colorHex),bundle.lighting.key.intensity);
key.position.set(...bundle.lighting.key.positionMicrounits.map(m));scene.add(key);
const harness=createPerfHarness();
let measuring=false;
startBtn.disabled=false; // engine ready
startBtn.onclick=()=>{
 if(measuring)return;
 harness.start({deviceId:document.getElementById('deviceId').value,
  os:document.getElementById('os').value||navigator.platform||'',
  browser:document.getElementById('browser').value||navigator.userAgent||'',
  physicalDeviceAttested:document.getElementById('attest').checked,
  startedAt:new Date().toISOString()});
 measuring=true;out.textContent='';statusEl.textContent='מודד... 0/'+WINDOW_FRAMES};
renderer.setAnimationLoop(ts=>{
 renderer.render(scene,camera);
 if(!measuring)return;
 harness.recordFrame(ts);
 statusEl.textContent='מודד... '+harness.frameCount+'/'+WINDOW_FRAMES;
 if(harness.complete){measuring=false;
  const result=harness.finalize();
  statusEl.textContent=result.status==='MEASURED'?'הושלם - MEASURED':'INVALID: '+result.invalidReason;
  out.textContent=JSON.stringify(result,null,1);
  document.body.dataset.perfStatus=result.status;
  window.__perfResult=result}});
document.body.dataset.engineReady='true';
</script></body></html>
