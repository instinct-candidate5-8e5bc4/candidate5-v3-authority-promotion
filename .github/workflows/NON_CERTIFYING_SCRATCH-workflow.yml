          [ "$rc" = "97" ] && grep -F "E_CHECKOUT_MUTATED unexpected untracked path: ${B}x-evil/e" "$T/sib.log" > /dev/null || { echo "E_GATETEST sibling-prefix case rc=$rc"; cat "$T/sib.log"; exit 97; }
