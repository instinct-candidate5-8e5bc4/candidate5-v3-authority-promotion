# NON_CERTIFYING_SCRATCH - pre-freeze KVM scratch lane (r3 ruling 3/H1). NO EVIDENCE WEIGHT.
# This workflow NEVER certifies anything and its runs carry no section-F evidence weight;
# findings here only feed the correction batch. It must never emit OVMF_CI_SECURE_BOOT_UKI_PASS
# or any certification marker (the forbidden-marker guard below is kept). Every artifact name
# begins NON_CERTIFYING_SCRATCH. It exists ONLY on p3-scratch-* commits in the existing
# candidate repository (no default-branch registration, never in the candidate tree handed
# for STATIC REVIEW). KVM-only, fail-closed, no TCG. Public standard runner only ($0).
# Every run URL and outcome is preserved and reported. Fail-closed: the first step of every
# job aborts the run unless github.run_attempt == 1 AND github.ref is under refs/heads/p3-scratch-;
# force-pushes are rejected. Every GitHub action is pinned to a full-length commit SHA.
name: NON_CERTIFYING_SCRATCH
on:
  push:
    branches: ['p3-scratch-*']
permissions: {}
env:
  PREFIX: NON_CERTIFYING_SCRATCH
jobs:
  rehearsal:
    # ubuntu-22.04 pinned: the canonical-path mechanism (build-ovmf-debug.sh) needs
    # unprivileged user namespaces for bwrap; ubuntu-24.04 runners restrict them via
    # AppArmor.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: NON_CERTIFYING_SCRATCH ref+attempt fail-closed gate
        env:
          EV_CREATED: ${{ github.event.created }}
          EV_FORCED: ${{ github.event.forced }}
          EV_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [ "${{ github.run_attempt }}" = "1" ] || { echo "E_RERUN_FORBIDDEN run_attempt=${{ github.run_attempt }}"; exit 89; }
          case "${{ github.ref }}" in
            refs/heads/p3-scratch-*) : ;;
            *) echo "E_REF_MISMATCH ref=${{ github.ref }}"; exit 89 ;;
          esac
          # pushed-once gate (scratch form): force-push is forbidden; successive scratch commits are allowed
          [ "$EV_FORCED" = "false" ] || { echo "E_PUSHED_ONCE forced=$EV_FORCED"; exit 89; }
          mkdir -p /tmp/$PREFIX-out
          date +%s >> /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-step-stamps.txt
      - name: NON_CERTIFYING_SCRATCH kvm fail-closed check
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then echo "E_NO_KVM"; exit 90; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - name: workflow-argument existence gate (D2, fail-closed)
        run: |
          set -euo pipefail
          # D2 gate (reviewer ruling): every relative file/script argument used by later
          # steps must exist in the committed tree. Fixed list, fail-closed exit 88.
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          for f in             platform.lock.json             config.json             stage-platform.sh             make-shims.sh             preflight-check.py             build-ovmf-debug.sh             scan-pe-pdb-paths.py             build-enroll-app.sh             bwrap-argv.sh             enroll-predicate-check.py             rehearsal-enroll.sh             ../build-esp-image.sh             evidence/successor-signed.efi             run-ceremony.sh             qemu-smoke.sh; do
            [ -e "$f" ] || { echo "E_WORKFLOW_ARG_MISSING $f"; exit 88; }
          done
      - name: NON_CERTIFYING_SCRATCH host inputs declared (B3)
        run: |
          set -euo pipefail
          mkdir -p /tmp/$PREFIX-out
          : > /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-host-inputs.txt
          for t in gcc make sha256sum; do
            p=$(command -v "$t")
            v=$("$t" --version 2>&1 | head -1 || true)
            h=$(sha256sum "$p" | cut -d' ' -f1)
            printf 'host-input %s %s %s %s\n' "$t" "$p" "$h" "$v" >> /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-host-inputs.txt
          done
          # python declared host input (batch1r3 addendum2 condition 2a): full interpreter identity
          pp=$(command -v python3)
          rp=$(realpath "$pp")
          case "$rp" in /usr/bin/*) ;; *) echo "E_PYTHON_HOST_PATH $rp"; exit 51;; esac
          [ -z "${VIRTUAL_ENV:-}" ] || { echo "E_PYTHON_VENV $VIRTUAL_ENV"; exit 51; }
          python3 - "$pp" "$rp" >> /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-host-inputs.txt <<'PYEOF'
          import sys, os, hashlib
          pp, rp = sys.argv[1], sys.argv[2]
          print("host-python path=" + pp)
          print("host-python realpath=" + rp)
          print("host-python realpath_sha256=" + hashlib.sha256(open(rp, "rb").read()).hexdigest())
          print("host-python version=" + repr(sys.version))
          print("host-python flags=" + repr(sys.flags))
          print("host-python pythonhashseed=" + os.environ.get("PYTHONHASHSEED", "<unset>"))
          PYEOF
          cat /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-host-inputs.txt
      - name: NON_CERTIFYING_SCRATCH platform staging (only network phase)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          ./stage-platform.sh platform.lock.json /tmp/$PREFIX-stage
          # addendum2 condition 2: fetch the four lock-recorded index snapshots for the
          # byte-for-byte lockgen regeneration gate (inside the only network phase)
          mkdir -p /tmp/$PREFIX-lockgen-indices
          python3 - platform.lock.json "$PREFIX" <<'PYEOF'
          import json, hashlib, urllib.request, sys
          lock = json.load(open("platform.lock.json"))
          for name, ent in sorted(lock["indices"].items()):
              data = urllib.request.urlopen(ent["url"], timeout=60).read()
              got = hashlib.sha256(data).hexdigest()
              if got != ent["sha256"]:
                  print("E_LOCKGEN_INDEX_MISMATCH", name, got)
                  raise SystemExit(52)
              open("/tmp/" + sys.argv[2] + "-lockgen-indices/" + name + ".xz", "wb").write(data)
              print("index", name, len(data), "bytes", got)
          PYEOF
      - name: NON_CERTIFYING_SCRATCH userns/bwrap preflight (staged, lock-verified bwrap)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          ./make-shims.sh /tmp/$PREFIX-stage /tmp/$PREFIX-stage/shims >/dev/null
          REALWORK=$(mktemp -d /tmp/$PREFIX-preflight-realwork.XXXXXX)
          rc=0
          out=$(./bwrap-argv.sh canonical /tmp/$PREFIX-stage/shims/bwrap "$REALWORK" -- true 2>&1) || rc=$?
          rm -rf "$REALWORK"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -qiE 'create new namespace|creating new namespace|setting up [ug]id map|user namespace'; then
              echo "E_NO_USERNS: staged bwrap canonical-path mechanism unavailable on this runner"
              exit 91
            fi
            echo "E_PREFLIGHT_NS_EXEC: staged bwrap namespace test failed (rc=$rc)"
            exit 91
          fi
      - name: NON_CERTIFYING_SCRATCH lockgen byte-for-byte regeneration (addendum2 condition 2)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          rm -rf /tmp/$PREFIX-lockgen && mkdir -p /tmp/$PREFIX-lockgen
          cp platform-lockgen.py /tmp/$PREFIX-lockgen/
          cp /tmp/$PREFIX-lockgen-indices/noble-main.xz /tmp/$PREFIX-lockgen-indices/noble-updates-main.xz /tmp/$PREFIX-lockgen-indices/noble-universe.xz /tmp/$PREFIX-lockgen-indices/noble-updates-universe.xz /tmp/$PREFIX-lockgen/
          (cd /tmp/$PREFIX-lockgen && python3 platform-lockgen.py)
          cmp /tmp/$PREFIX-lockgen/platform.lock.json platform.lock.json || { echo "E_LOCKGEN_NONDET"; exit 52; }
          echo "committed lockgen regenerates the committed lock byte-for-byte"
      - name: NON_CERTIFYING_SCRATCH preflight static conformance
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          python3 preflight-check.py config.json /tmp/$PREFIX-stage
      - name: NON_CERTIFYING_SCRATCH reproducible OVMF DEBUG dual build + accepted-firmware pins
        timeout-minutes: 150
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          ./build-ovmf-debug.sh /tmp/$PREFIX-stage /tmp/$PREFIX-ovmf-a /tmp/$PREFIX-ovmf-b
          cmp /tmp/$PREFIX-ovmf-a/OVMF_CODE.fd /tmp/$PREFIX-ovmf-b/OVMF_CODE.fd
          cmp /tmp/$PREFIX-ovmf-a/OVMF_VARS.fd /tmp/$PREFIX-ovmf-b/OVMF_VARS.fd
          echo "dual OVMF build byte-identical (canonical path /build)"
          # batch1r3 C6: the runner-1 FD raw scan is REMOVED (non-evidentiary); the
          # module-level condition-5 parse runs in env2 over the preserved Build tree.
          # hard gates: the accepted firmware is exactly these bytes (hash AND size)
          HC=$(sha256sum /tmp/$PREFIX-ovmf-a/OVMF_CODE.fd | cut -d' ' -f1)
          [ "$HC" = "fc150336fce10eb5508fa440cdf7300622c8c3ac71f2fbe10a0731422b9cef24" ] || { echo "E_CODE_PIN_MISMATCH $HC"; exit 95; }
          [ "$(stat -c%s /tmp/$PREFIX-ovmf-a/OVMF_CODE.fd)" = "3653632" ] || { echo "E_CODE_PIN_SIZE"; exit 95; }
          HV=$(sha256sum /tmp/$PREFIX-ovmf-a/OVMF_VARS.fd | cut -d' ' -f1)
          [ "$HV" = "5d2ac383371b408398accee7ec27c8c09ea5b74a0de0ceea6513388b15be5d1e" ] || { echo "E_VARS_PIN_MISMATCH $HV"; exit 95; }
          [ "$(stat -c%s /tmp/$PREFIX-ovmf-a/OVMF_VARS.fd)" = "540672" ] || { echo "E_VARS_PIN_SIZE"; exit 95; }
          sha256sum /tmp/$PREFIX-ovmf-a/OVMF_CODE.fd /tmp/$PREFIX-ovmf-a/OVMF_VARS.fd \
            > /tmp/$PREFIX-fw-hashes.txt
          cat /tmp/$PREFIX-fw-hashes.txt
      - name: NON_CERTIFYING_SCRATCH hostile-path drift demonstration (condition 5)
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          # deliberately NON-canonical host path: the PDB-path verifier MUST reject it.
          # fail-closed: require exit EXACTLY 43 from the scan of the preserved hostile
          # module tree, EVERY scanned module carrying the hostile path, and real drift.
          CANON_MODE=hostile CANON_REALWORK=/var/tmp/$PREFIX-hostile-work \
            ./build-ovmf-debug.sh /tmp/$PREFIX-stage /tmp/$PREFIX-hostile-out
          set +e
          SCAN_OUT=$(python3 scan-pe-pdb-paths.py /var/tmp/$PREFIX-hostile-work/edk2/Build /build/ 2>&1)
          RC=$?
          set -e
          echo "$SCAN_OUT"
          [ "$RC" = "43" ] || { echo "E_HOSTILE_NOT_REJECTED rc=$RC (must be exactly 43; PASS, crash, missing tree or vacuous 45 all fail closed)"; exit 92; }
          MODS=$(printf '%s\n' "$SCAN_OUT" | sed -n 's/^scanned \([0-9][0-9]*\) PE files.*/\1/p')
          BAD=$(printf '%s\n' "$SCAN_OUT" | sed -n 's/^VERDICT: REJECT (\([0-9][0-9]*\) of [0-9][0-9]* modules.*/\1/p')
          [ -n "$MODS" ] && [ "$MODS" -gt 0 ] || { echo "E_HOSTILE_VACUOUS modules='$MODS'"; exit 92; }
          [ "$BAD" = "$MODS" ] || { echo "E_HOSTILE_PARTIAL_REJECT bad=$BAD modules=$MODS (every module must carry the hostile path)"; exit 92; }
          HH=$(sha256sum /tmp/$PREFIX-hostile-out/OVMF_CODE.fd | cut -d' ' -f1)
          [ "$HH" != "fc150336fce10eb5508fa440cdf7300622c8c3ac71f2fbe10a0731422b9cef24" ] || { echo "E_HOSTILE_NO_DRIFT: hostile build equals the accepted firmware"; exit 92; }
          echo "hostile-path build REJECTED: all $MODS modules carry the hostile path (exit exactly 43); drift confirmed $HH"
          sha256sum /tmp/$PREFIX-hostile-out/OVMF_CODE.fd >> /tmp/$PREFIX-fw-hashes.txt
      - name: NON_CERTIFYING_SCRATCH network-cut canary (must fail)
        run: |
          set -euo pipefail
          # batch1r3 C3: a fetch inside the cut namespace MUST fail, proving the cut is real
          if sudo unshare -n curl -fsS --max-time 10 https://archive.ubuntu.com/ >/dev/null 2>&1; then
            echo "E_NET_CANARY_LEAK: network reachable inside unshare -n"; exit 96
          fi
          echo "network-cut canary failed as required"
      - name: NON_CERTIFYING_SCRATCH enrollment app + ESP dual builds (network-enforced-off)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          # batch1r3 C3: both builders run with the network enforced off; all inputs are staged
          sudo unshare -n ./build-enroll-app.sh /tmp/$PREFIX-stage /tmp/$PREFIX-app-a /tmp/$PREFIX-app-b
          cmp /tmp/$PREFIX-app-a/enroll-app.efi /tmp/$PREFIX-app-b/enroll-app.efi
          sha256sum /tmp/$PREFIX-app-a/enroll-app.efi >> /tmp/$PREFIX-fw-hashes.txt
          # batch1r3 C1: the ESP step runs with the staged-loader shims on PATH
          export PATH="/tmp/$PREFIX-stage/shims:$PATH"
          sudo unshare -n env PATH="$PATH" ../build-esp-image.sh evidence/successor-signed.efi /tmp/$PREFIX-esp-a
          sudo unshare -n env PATH="$PATH" ../build-esp-image.sh evidence/successor-signed.efi /tmp/$PREFIX-esp-b
          [ "$(sha256sum /tmp/$PREFIX-esp-a/c5-root-admitter-uki-v3-esp.raw | cut -d' ' -f1)" = \
            "2bfa621238890890765c9636f99dabfb46233bfa626afb580ce33e65858019c9" ]
          cmp /tmp/$PREFIX-esp-a/c5-root-admitter-uki-v3-esp.raw /tmp/$PREFIX-esp-b/c5-root-admitter-uki-v3-esp.raw
      - name: NON_CERTIFYING_SCRATCH firmware hash upload (env2 comparison input)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: NON_CERTIFYING_SCRATCH-fw-hashes
          path: /tmp/NON_CERTIFYING_SCRATCH-fw-hashes.txt
          retention-days: 90
          if-no-files-found: error
      - name: NON_CERTIFYING_SCRATCH qemu staged-ROM gates (A3)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          # batch1r3 scratch-1 finding: a stock Ubuntu qemu binary ALWAYS lists its three
          # compiled-in host paths after the -L dirs; "only staged paths listed" is
          # unsatisfiable and was a gate-design error. The load-bearing form: the two staged
          # -L dirs must LEAD the search order (precedence), the remaining entries must be
          # EXACTLY the three pinned compiled-in paths (inert strings), and the masked smoke
          # below proves they are never opened.
          LOUT=$(/tmp/$PREFIX-stage/shims/qemu-system-x86_64 -L help 2>&1)
          printf '%s\n' "$LOUT"
          WANT_HEAD="/tmp/$PREFIX-stage/root/usr/share/qemu
          /tmp/$PREFIX-stage/root/usr/share/seabios"
          [ "$(printf '%s\n' "$LOUT" | head -2)" = "$WANT_HEAD" ] || { echo "E_QEMU_L_ORDER"; exit 97; }
          WANT_REST="/usr/lib/ipxe/qemu
          /usr/share/qemu
          /usr/share/seabios"
          [ "$(printf '%s\n' "$LOUT" | tail -n +3 | sort)" = "$WANT_REST" ] || { echo "E_QEMU_L_UNKNOWN"; exit 97; }
          # masked-host binding smoke: qemu-smoke.sh self-wraps under the staged
          # lock-verified bwrap with /usr assembled piecemeal so the four host qemu dirs
          # are ABSENT by construction (bwrap cannot mkdir a mountpoint under a read-only
          # mount - scratch run 2 finding); -S: the CPU never starts, no case is booted
          # sudo like the ceremony: /dev/kvm is root:kvm 0660; with euid 0 bwrap maps ns uid 0
          # to real uid 0 so the device owner is mapped inside the namespace (scratch run 5)
          sudo env PREFIX="$PREFIX" ./qemu-smoke.sh config.json argv-freeze.json 0 \
              > /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-qemu-smoke.log 2>&1 \
            || { echo "E_QEMU_SMOKE"; cat /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-qemu-smoke.log; exit 97; }
          echo "masked-host binding smoke OK (exact frozen case argv + -S, four host qemu dirs absent, no case booted)"
      - name: NON_CERTIFYING_SCRATCH ceremony (network-enforced-off, tee'd log)
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          mkdir -p /tmp/$PREFIX-out
          date +%s >> /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-step-stamps.txt
          sudo unshare -n ./run-ceremony.sh config.json /tmp/$PREFIX-stage /tmp/$PREFIX-out 2>&1 \
            | tee /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-ceremony.log
      - name: NON_CERTIFYING_SCRATCH ceremony interpreter cross-check (addendum2 condition 2b)
        run: |
          set -euo pipefail
          grep '^host-python ' /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-host-inputs.txt > /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-expected-ceremony-python.txt
          diff /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-expected-ceremony-python.txt /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-ceremony-python.txt || { echo "E_CEREMONY_PYTHON_DRIFT"; exit 51; }
          echo "ceremony interpreter identical to the job record"
      - name: NON_CERTIFYING_SCRATCH forbidden-marker guard
        run: |
          set -euo pipefail
          # fail-closed form: explicit if, fixed-string binary-inclusive scan (-a -F) of the
          # ENTIRE evidence tree (which includes the tee'd ceremony log), then a top-level
          # prefix guard so no un-prefixed path can sit next to the prefixed evidence.
          set +e
          GUARD_OUT=$(grep -r -a -F -l "OVMF_CI_SECURE_BOOT_UKI_PASS" /tmp/$PREFIX-out)
          GUARD_RC=$?
          set -e
          if [ "$GUARD_RC" -eq 0 ]; then
            echo "E_FORBIDDEN_MARKER_IN_EVIDENCE"; printf '%s\n' "$GUARD_OUT"; exit 94
          fi
          if [ "$GUARD_RC" -ne 1 ]; then
            echo "E_MARKER_GUARD_RC rc=$GUARD_RC (grep rc 1 = pass; anything else = fail)"; exit 94
          fi
          if [ -n "$(find /tmp/$PREFIX-out -mindepth 1 -maxdepth 1 ! -name 'NON_CERTIFYING_SCRATCH*' -print -quit)" ]; then
            echo "E_UNPREFIXED_TOPLEVEL_EVIDENCE"; exit 94
          fi
      - name: NON_CERTIFYING_SCRATCH evidence upload (ephemeral CI artifact only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: NON_CERTIFYING_SCRATCH-evidence
          path: |
            /tmp/NON_CERTIFYING_SCRATCH-out/
            /tmp/NON_CERTIFYING_SCRATCH-fw-hashes.txt
          retention-days: 90
          if-no-files-found: error

  # Reviewer condition 4: reproduce once in a SECOND FRESH ENVIRONMENT (separate runner)
  # at the same canonical in-container path /build with identical pinned inputs. The FD
  # hash must equal the first runner's. The Build tree is kept and every module's
  # CodeView PDB path is parsed: all absolute paths must carry the /build/ prefix.
  rehearsal-env2:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    needs: rehearsal
    steps:
      - name: NON_CERTIFYING_SCRATCH ref+attempt fail-closed gate
        env:
          EV_CREATED: ${{ github.event.created }}
          EV_FORCED: ${{ github.event.forced }}
          EV_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [ "${{ github.run_attempt }}" = "1" ] || { echo "E_RERUN_FORBIDDEN run_attempt=${{ github.run_attempt }}"; exit 89; }
          case "${{ github.ref }}" in
            refs/heads/p3-scratch-*) : ;;
            *) echo "E_REF_MISMATCH ref=${{ github.ref }}"; exit 89 ;;
          esac
          # pushed-once gate (scratch form): force-push is forbidden; successive scratch commits are allowed
          [ "$EV_FORCED" = "false" ] || { echo "E_PUSHED_ONCE forced=$EV_FORCED"; exit 89; }
          mkdir -p /tmp/$PREFIX-out
          date +%s >> /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-step-stamps.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - name: workflow-argument existence gate (D2, fail-closed)
        run: |
          set -euo pipefail
          # D2 gate (reviewer ruling): every relative file/script argument used by later
          # steps must exist in the committed tree. Fixed list, fail-closed exit 88.
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          for f in             platform.lock.json             config.json             stage-platform.sh             make-shims.sh             preflight-check.py             build-ovmf-debug.sh             scan-pe-pdb-paths.py             build-enroll-app.sh             bwrap-argv.sh             enroll-predicate-check.py             rehearsal-enroll.sh             ../build-esp-image.sh             evidence/successor-signed.efi             run-ceremony.sh; do
            [ -e "$f" ] || { echo "E_WORKFLOW_ARG_MISSING $f"; exit 88; }
          done
      - name: NON_CERTIFYING_SCRATCH env2 host inputs declared (B3)
        run: |
          set -euo pipefail
          mkdir -p /tmp/$PREFIX-env2-evidence
          : > /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt
          for t in gcc make sha256sum; do
            p=$(command -v "$t")
            v=$("$t" --version 2>&1 | head -1 || true)
            h=$(sha256sum "$p" | cut -d' ' -f1)
            printf 'host-input %s %s %s %s\n' "$t" "$p" "$h" "$v" >> /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt
          done
          # python declared host input (batch1r3 addendum2 condition 2a): full interpreter identity
          pp=$(command -v python3)
          rp=$(realpath "$pp")
          case "$rp" in /usr/bin/*) ;; *) echo "E_PYTHON_HOST_PATH $rp"; exit 51;; esac
          [ -z "${VIRTUAL_ENV:-}" ] || { echo "E_PYTHON_VENV $VIRTUAL_ENV"; exit 51; }
          python3 - "$pp" "$rp" >> /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt <<'PYEOF'
          import sys, os, hashlib
          pp, rp = sys.argv[1], sys.argv[2]
          print("host-python path=" + pp)
          print("host-python realpath=" + rp)
          print("host-python realpath_sha256=" + hashlib.sha256(open(rp, "rb").read()).hexdigest())
          print("host-python version=" + repr(sys.version))
          print("host-python flags=" + repr(sys.flags))
          print("host-python pythonhashseed=" + os.environ.get("PYTHONHASHSEED", "<unset>"))
          PYEOF
          cat /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt
      - name: NON_CERTIFYING_SCRATCH env2 platform staging (only network phase)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          ./stage-platform.sh platform.lock.json /tmp/$PREFIX-stage-env2
      - name: NON_CERTIFYING_SCRATCH env2 userns/bwrap preflight (staged, lock-verified bwrap)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          ./make-shims.sh /tmp/$PREFIX-stage-env2 /tmp/$PREFIX-stage-env2/shims >/dev/null
          REALWORK=$(mktemp -d /tmp/$PREFIX-env2-preflight-realwork.XXXXXX)
          rc=0
          out=$(./bwrap-argv.sh canonical /tmp/$PREFIX-stage-env2/shims/bwrap "$REALWORK" -- true 2>&1) || rc=$?
          rm -rf "$REALWORK"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -qiE 'create new namespace|creating new namespace|setting up [ug]id map|user namespace'; then
              echo "E_NO_USERNS: staged bwrap canonical-path mechanism unavailable on this runner"
              exit 91
            fi
            echo "E_PREFLIGHT_NS_EXEC: staged bwrap namespace test failed (rc=$rc)"
            exit 91
          fi
      - name: NON_CERTIFYING_SCRATCH env2 single canonical-path reproduction
        timeout-minutes: 150
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          CANON_REALWORK=/var/tmp/$PREFIX-env2-work CANON_SINGLE=1 \
            ./build-ovmf-debug.sh /tmp/$PREFIX-stage-env2 /tmp/$PREFIX-ovmf-env2
          # condition 5: parse EVERY module .efi PDB path in the preserved Build tree
          # (batch1r3 C6/T3 F10: scan root is exactly work/edk2/Build; module count is pinned)
          SCAN_OUT=$(python3 scan-pe-pdb-paths.py /var/tmp/$PREFIX-env2-work/work/edk2/Build /build/ 2>&1)
          printf '%s\n' "$SCAN_OUT"
          MODS=$(printf '%s\n' "$SCAN_OUT" | sed -n 's/^scanned \([0-9][0-9]*\) PE files.*/\1/p')
          [ "$MODS" = "366" ] || { echo "E_ENV2_SCAN_COUNT modules=$MODS (pinned 366)"; exit 92; }
          printf '%s\n' "$SCAN_OUT" > /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-pdb-scan.txt
      - name: NON_CERTIFYING_SCRATCH env2 enroll-app rebuild (C2)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          sudo unshare -n ./build-enroll-app.sh /tmp/$PREFIX-stage-env2 /tmp/$PREFIX-app-env2-a /tmp/$PREFIX-app-env2-b
          cmp /tmp/$PREFIX-app-env2-a/enroll-app.efi /tmp/$PREFIX-app-env2-b/enroll-app.efi
          HA=$(sha256sum /tmp/$PREFIX-app-env2-a/enroll-app.efi | cut -d' ' -f1)
          [ "$HA" = "540b4fa3990f998cb803160482bd50e9670a47da3d534acc3ade91364a85f3ee" ] || { echo "E_APP_PIN_MISMATCH $HA"; exit 46; }
          sha256sum /tmp/$PREFIX-app-env2-a/enroll-app.efi > /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-app-hash.txt
      - name: NON_CERTIFYING_SCRATCH env2 accepted-firmware pins + runner-1 hash echo
        run: |
          set -euo pipefail
          HC=$(sha256sum /tmp/$PREFIX-ovmf-env2/OVMF_CODE.fd | cut -d' ' -f1)
          [ "$HC" = "fc150336fce10eb5508fa440cdf7300622c8c3ac71f2fbe10a0731422b9cef24" ] || { echo "E_CODE_PIN_MISMATCH $HC"; exit 95; }
          [ "$(stat -c%s /tmp/$PREFIX-ovmf-env2/OVMF_CODE.fd)" = "3653632" ] || { echo "E_CODE_PIN_SIZE"; exit 95; }
          HV=$(sha256sum /tmp/$PREFIX-ovmf-env2/OVMF_VARS.fd | cut -d' ' -f1)
          [ "$HV" = "5d2ac383371b408398accee7ec27c8c09ea5b74a0de0ceea6513388b15be5d1e" ] || { echo "E_VARS_PIN_MISMATCH $HV"; exit 95; }
          [ "$(stat -c%s /tmp/$PREFIX-ovmf-env2/OVMF_VARS.fd)" = "540672" ] || { echo "E_VARS_PIN_SIZE"; exit 95; }
          sha256sum /tmp/$PREFIX-ovmf-env2/OVMF_CODE.fd /tmp/$PREFIX-ovmf-env2/OVMF_VARS.fd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: NON_CERTIFYING_SCRATCH-fw-hashes
          path: /tmp/NON_CERTIFYING_SCRATCH-fw1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: NON_CERTIFYING_SCRATCH-evidence
          path: /tmp/NON_CERTIFYING_SCRATCH-env1-evidence
      - name: NON_CERTIFYING_SCRATCH env2 host-inputs cross-job diff (B3)
        run: |
          set -euo pipefail
          diff /tmp/$PREFIX-env1-evidence/NON_CERTIFYING_SCRATCH-out/NON_CERTIFYING_SCRATCH-host-inputs.txt \
               /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt \
            || { echo "E_HOST_INPUTS_DRIFT"; exit 98; }
          echo "host inputs identical across jobs"
      - name: NON_CERTIFYING_SCRATCH env2 cross-runner byte-identity gate
        run: |
          set -euo pipefail
          H1=$(grep -- "-ovmf-a/OVMF_CODE.fd" /tmp/$PREFIX-fw1/$PREFIX-fw-hashes.txt | cut -d' ' -f1)
          H2=$(sha256sum /tmp/$PREFIX-ovmf-env2/OVMF_CODE.fd | cut -d' ' -f1)
          [ "$H1" = "$H2" ] || { echo "E_ENV2_HASH_MISMATCH $H1 $H2"; exit 93; }
          A1=$(grep -- "-app-a/enroll-app.efi" /tmp/$PREFIX-fw1/$PREFIX-fw-hashes.txt | cut -d' ' -f1)
          A2=$(sha256sum /tmp/$PREFIX-app-env2-a/enroll-app.efi | cut -d' ' -f1)
          [ "$A1" = "$A2" ] || { echo "E_ENV2_APP_MISMATCH $A1 $A2"; exit 93; }
          echo "env2 reproduction byte-identical across runners at canonical /build (firmware + enroll app)"
      - name: NON_CERTIFYING_SCRATCH env2 evidence upload (ephemeral CI artifact only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: NON_CERTIFYING_SCRATCH-env2-evidence
          path: /tmp/NON_CERTIFYING_SCRATCH-env2-evidence/
          retention-days: 90
          if-no-files-found: error
