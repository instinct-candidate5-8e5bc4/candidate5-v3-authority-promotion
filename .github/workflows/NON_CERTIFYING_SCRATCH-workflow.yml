      - name: NON_CERTIFYING_SCRATCH qemu staged-ROM gates (A3)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          # batch1r3 scratch-1 finding: a stock Ubuntu qemu binary ALWAYS lists its three
          # compiled-in host paths after the -L dirs; "only staged paths listed" is
          # unsatisfiable and was a gate-design error. The load-bearing form: the two staged
          # -L dirs must LEAD the search order (precedence), the remaining entries must be
          # EXACTLY the three pinned compiled-in paths (inert strings), and the masked smoke
          # below proves they are never opened.
          LOUT=$(/tmp/$PREFIX-stage/shims/qemu-system-x86_64 -L help 2>&1)
          printf '%s\n' "$LOUT"
          WANT_HEAD="/tmp/$PREFIX-stage/root/usr/share/qemu
          /tmp/$PREFIX-stage/root/usr/share/seabios"
          [ "$(printf '%s\n' "$LOUT" | head -2)" = "$WANT_HEAD" ] || { echo "E_QEMU_L_ORDER"; exit 97; }
          WANT_REST="/usr/lib/ipxe/qemu
          /usr/share/qemu
          /usr/share/seabios"
          [ "$(printf '%s\n' "$LOUT" | tail -n +3 | sort)" = "$WANT_REST" ] || { echo "E_QEMU_L_UNKNOWN"; exit 97; }
          # masked-host binding smoke: qemu-smoke.sh self-wraps under the staged
          # lock-verified bwrap with /usr assembled piecemeal so the four host qemu dirs
          # are ABSENT by construction (bwrap cannot mkdir a mountpoint under a read-only
          # mount - scratch run 2 finding); -S: the CPU never starts, no case is booted
          # sudo like the ceremony: /dev/kvm is root:kvm 0660; with euid 0 bwrap maps ns uid 0
          # to real uid 0 so the device owner is mapped inside the namespace (scratch run 5)
          # scratch-7: run 35929024811 failed with "bwrap: execvp .../qemu-smoke.sh:
          # Permission denied" under the sudo invocation; the -L precedence gates passed
          # first (exactly the four allowed entries printed). Hypothesis UNDER TEST (peer
          # ruling: diagnosis to test, not established finding): with euid 0 bwrap maps
          # ONLY ns uid 0 to real root, leaving the checkout owner (runner) unmapped inside
          # the namespace, so traversal of the runner home chain falls to other-x and the
          # exec fails EACCES (run-5/run-6 mapping symmetry: run 5 mapped the runner and
          # failed on the root-owned KVM node; run 6 maps root and fails on the
          # runner-owned tree). Evidence FIRST (peer requirements): script modes/owners
          # from disk and from the git index (both scripts committed 100755; no exec bit
          # is ever set at runtime), component-wise traversal perms as runner and root,
          # and mount options on the checkout dir and every structural bind target
          # (noexec hunt; the piecemeal /usr siblings share these same filesystems):
          id
          stat -c '%A %a %U:%g %n' qemu-smoke.sh bwrap-argv.sh
          git ls-files -s -- qemu-smoke.sh bwrap-argv.sh
          git config --local --get-regexp '^http\.' || echo "no token in .git/config (persist-credentials: false)"
          git status --porcelain | grep . && { echo "E_SMOKE_PREP_TREE_DIRTY"; git status --porcelain; exit 97; } || echo "git status --porcelain: EMPTY (before repair)"
          echo "hashed-input SHAs BEFORE repair:"
          B4="$(sha256sum qemu-smoke.sh bwrap-argv.sh config.json argv-freeze.json make-disks.sh)"; printf '%s\n' "$B4"
          namei -l "$PWD/qemu-smoke.sh"
          sudo namei -l "$PWD/qemu-smoke.sh"
          for t in "$GITHUB_WORKSPACE" / /tmp /etc /home /usr /usr/share /usr/lib /usr/lib/x86_64-linux-gnu /dev/kvm /tmp/$PREFIX-stage /tmp/$PREFIX-ovmf-a /tmp/$PREFIX-esp-a /tmp/$PREFIX-out; do
            findmnt -T "$t" -o TARGET,SOURCE,FSTYPE,OPTIONS
          done
          # Diagnosis test by remediation, NARROWED (peer #7 boundary 1/3): directory
          # traverse bits ONLY. The checkout materializes 0755 dirs / 0644 files
          # (other-read already present), so NO regular-file mode ever changes, no exec
          # bit is added anywhere, and no capital X is used. Each chmod is logged
          # verbatim and namei is re-printed after; ephemeral $0 runner, discarded.
          p="$PWD"; while [ "$p" != "/" ]; do echo "+ chmod o+x $p"; sudo chmod o+x "$p"; p="$(dirname "$p")"; done
          find "$PWD" -type d ! -perm -005 -print -exec chmod o+rx {} +
          namei -l "$PWD/qemu-smoke.sh"
          # fail-closed verification as the OTHER permission class (nobody approximates
          # the overflow uid the unmapped checkout owner collapses to in the namespace):
          for f in qemu-smoke.sh bwrap-argv.sh config.json argv-freeze.json make-disks.sh; do
            sudo -u nobody test -r "$PWD/$f" || { echo "E_SMOKE_PREP other-read $f"; exit 97; }
          done
          sudo -u nobody test -x "$PWD/qemu-smoke.sh" || { echo "E_SMOKE_PREP other-exec qemu-smoke.sh"; exit 97; }
          sudo -u nobody test -x "$PWD/make-disks.sh" || { echo "E_SMOKE_PREP other-exec make-disks.sh"; exit 97; }
          echo "hashed-input SHAs AFTER repair (must equal BEFORE, F4 fail-closed):"
          A4="$(sha256sum qemu-smoke.sh bwrap-argv.sh config.json argv-freeze.json make-disks.sh)"; printf '%s\n' "$A4"
          [ "$A4" = "$B4" ] || { echo "E_SMOKE_PREP_DRIFT"; exit 97; }
          git ls-files -s -- qemu-smoke.sh bwrap-argv.sh
          git status --porcelain | grep . && { echo "E_SMOKE_PREP_TREE_DIRTY"; git status --porcelain; exit 97; } || echo "git status --porcelain: EMPTY (after repair)"
          sudo env PREFIX="$PREFIX" ALLOWED_PREFIX="$ALLOWED_PREFIX" ./qemu-smoke.sh config.json argv-freeze.json 0 \
              > /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-qemu-smoke.log 2>&1 \
            || { echo "E_QEMU_SMOKE"; cat /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-qemu-smoke.log; exit 97; }
          # peer N8 (log-or-fail): the raw/executed equivalence proof must be IN the durable
          # smoke log, not just implied by exit 0. The two source print sites are if/else
          # branches - exactly ONE line per executed smoke (run-9 ground truth: exactly 1,
          # line 38; the publisher's "absent" claim was wrong). Absent OR duplicated fails.
          _lc=$(grep -cF "lane argv check:" /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-qemu-smoke.log || true)
          [ "$_lc" = "1" ] || { echo "E_QEMU_SMOKE_ARGV_LANE_LOG expected exactly 1 reverse-rewrite verification line in smoke log, found $_lc"; exit 97; }
          grep -F "lane argv check:" /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-qemu-smoke.log
          echo "masked-host binding smoke OK (exact frozen case argv + -S, four host qemu dirs absent, no case booted)"

