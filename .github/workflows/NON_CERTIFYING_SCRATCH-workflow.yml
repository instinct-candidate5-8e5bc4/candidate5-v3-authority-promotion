            "$REH/rehearsal-enroll.sh" config.json "$PREPP" "$PFD/vars.fd" "$PFD/evidence" ) \
            > "$PFD/pf5.log" 2>&1 || _rc=$?
          cat "$PFD/pf5.log"
          grep -F "PLANTED FAULT ACTIVE: nolfn" "$PFD/pf5.log" \
            || { echo "E_PF_NOT_INJECTED no PLANTED FAULT ACTIVE line" | tee -a "$PFD/pf5.log"; exit 97; }
          grep -F "planted fault injection confirmation:" "$PFD/pf5.log" \
            || { echo "E_PF_NOT_INJECTED no before/after injection confirmation" | tee -a "$PFD/pf5.log"; exit 97; }
          # L4 must-show: the run-12 8.3-only layout is fsck-SILENT and must die pre-boot on
          # the name-contract reader with E_ENROLL_FAT_NAME_CONTRACT, never at boot.
          grep -F "enroll-fat-fsck.log (fsck.vfat -n rc=0)" "$PFD/pf5.log" \
            || { echo "E_PF_GATE_WRONG_DIAG fault was not fsck-silent" | tee -a "$PFD/pf5.log"; exit 97; }
          [ "$_rc" = "97" ] \
            || { echo "E_PF_GATE_NOT_FIRED expected exit 97, got $_rc" | tee -a "$PFD/pf5.log"; exit 97; }
          ! grep -F "E_BASH_ERRTRAP" "$PFD/pf5.log" \
            || { echo "E_PF_TRAP_MASKED E_BASH_ERRTRAP present - the named gate must be the failure" | tee -a "$PFD/pf5.log"; exit 97; }
          grep -F "E_ENROLL_FAT_NAME_CONTRACT" "$PFD/pf5.log" \
            || { echo "E_PF_GATE_WRONG_CODE" | tee -a "$PFD/pf5.log"; exit 97; }
          grep -F "contract name 'db.auth' has no valid LFN entry" "$PFD/pf5.log" \
            || { echo "E_PF_GATE_WRONG_DIAG" | tee -a "$PFD/pf5.log"; exit 97; }
          echo "PF_5_MUST_SHOW_OK injected fsck-silent 8.3-only image died pre-boot with E_ENROLL_FAT_NAME_CONTRACT exit 97" | tee -a "$PFD/pf5.log"
          grep -F "PF_5_MUST_SHOW_OK" "$PFD/pf5.log" || { echo "E_PF_LOG_VERDICT_MISSING"; exit 97; }
      - name: NON_CERTIFYING_SCRATCH planted-fault PF-6 badpred predicate-fail must-show (peer run-13 D13-1)
        id: pf6
        if: "!cancelled() && steps.pf-prereq.outputs.ok == 'true'"
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          REH="$PWD"
          # peer run-12 shape (chosen option): NO PF-only knobs to the shared code/config.
          # Each PF wrapper recreates the ceremony's SAME relative cwd layout in its own
          # work dir and runs the UNCHANGED shared code against the committed config bytes.
          mkdir -p /tmp/$PREFIX-out
          export PATH="/tmp/$PREFIX-stage/shims:$PATH"
          PFD=/tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-pf6-dir
          PREPP=/tmp/$PREFIX-pfprep-6
          # K1 (peer run-12 K4): PF prep (which contains the throwaway private keys) lives
          # OUTSIDE the upload tree and is removed by this step's own EXIT trap. Absolute
          # rule: no *.key under any EVIDENCE_UPLOAD_PATHS entry.
          trap 'rm -rf "$PREPP"' EXIT
          PFWORK="$PFD/work"
          mkdir -p "$PFWORK/build-output/enroll-app" "$PFWORK/build-output/ovmf-debug"
          cp /tmp/$PREFIX-app-a/enroll-app.efi "$PFWORK/build-output/enroll-app/enroll-app.efi"
          [ "$(sha256sum "$PFWORK/build-output/enroll-app/enroll-app.efi" | cut -d' ' -f1)" = "540b4fa3990f998cb803160482bd50e9670a47da3d534acc3ade91364a85f3ee" ] \
            || { echo "E_PF_SETUP enroll-app sha mismatch after copy" | tee -a "$PFD/prep.log"; exit 97; }
          cp /tmp/$PREFIX-ovmf-a/OVMF_CODE.fd "$PFWORK/build-output/ovmf-debug/OVMF_CODE.fd"
          [ "$(sha256sum "$PFWORK/build-output/ovmf-debug/OVMF_CODE.fd" | cut -d' ' -f1)" = "fc150336fce10eb5508fa440cdf7300622c8c3ac71f2fbe10a0731422b9cef24" ] \
            || { echo "E_PF_SETUP OVMF_CODE sha mismatch after copy" | tee -a "$PFD/prep.log"; exit 97; }
          cp config.json "$PFWORK/config.json"
          "$REH/enroll-prep.sh" /tmp/$PREFIX-stage/root "$PREPP" "$REH/evidence/c5-signing-cert.der" "$REH/evidence/C5-HOSTILE-FIXTURE.cer" \
            > "$PFD/prep.log" 2>&1 \
            || { echo "E_PF_PREP rc=$?" | tee -a "$PFD/prep.log"; cat "$PFD/prep.log"; exit 97; }
          _rc=0
          ( cd "$PFWORK" && sudo env PREFIX="$PREFIX" ALLOWED_PREFIX="$ALLOWED_PREFIX" PATH="$PATH" ENROLL_PLANTED_FAULT=badpred \
            "$REH/rehearsal-enroll.sh" config.json "$PREPP" "$PFD/vars.fd" "$PFD/evidence" ) \
            > "$PFD/pf6.log" 2>&1 || _rc=$?
          cat "$PFD/pf6.log"
          # D13-1 must-show: the predicate MUST reject the flipped ENROLL.TXT and the wrapper
          # MUST die with the predicate's OWN named code - never E_BASH_ERRTRAP (the #12 and
          # #13-tee masking shapes). The guest itself passes; only the evidence is poisoned.
          grep -F "PLANTED FAULT ACTIVE: badpred" "$PFD/pf6.log" \
            || { echo "E_PF_NOT_INJECTED no PLANTED FAULT ACTIVE line" | tee -a "$PFD/pf6.log"; exit 97; }
          grep -F "planted fault injection confirmation: ENROLL.TXT sha256" "$PFD/pf6.log" \
            || { echo "E_PF_NOT_INJECTED no before/after injection confirmation" | tee -a "$PFD/pf6.log"; exit 97; }
          grep -F "E_ENROLL_SET_DB" "$PFD/pf6.log" \
            || { echo "E_PF_GATE_WRONG_DIAG predicate did not reject SET_DB_STATUS=1" | tee -a "$PFD/pf6.log"; exit 97; }
          [ "$_rc" = "97" ] \
            || { echo "E_PF_GATE_NOT_FIRED expected exit 97, got $_rc" | tee -a "$PFD/pf6.log"; exit 97; }
          grep -F "E_ENROLL_PREDICATE_FAIL" "$PFD/pf6.log" \
            || { echo "E_PF_GATE_WRONG_CODE predicate failure must be named" | tee -a "$PFD/pf6.log"; exit 97; }
          ! grep -F "E_BASH_ERRTRAP" "$PFD/pf6.log" \
            || { echo "E_PF_TRAP_MASKED E_BASH_ERRTRAP present - D13-1 regression" | tee -a "$PFD/pf6.log"; exit 97; }
          echo "PF_6_MUST_SHOW_OK predicate-failing evidence died with E_ENROLL_PREDICATE_FAIL exit 97, no E_BASH_ERRTRAP" | tee -a "$PFD/pf6.log"
          grep -F "PF_6_MUST_SHOW_OK" "$PFD/pf6.log" || { echo "E_PF_LOG_VERDICT_MISSING"; exit 97; }
      - name: NON_CERTIFYING_SCRATCH ceremony (network-enforced-off, tee'd log)
        if: "!cancelled() && steps.pf-prereq.outputs.ok == 'true' && steps.pf1.outcome == 'success' && steps.pf2.outcome == 'success' && steps.pf4.outcome == 'success' && steps.pf5.outcome == 'success' && steps.pf6.outcome == 'success'"
        id: ceremony
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          mkdir -p /tmp/$PREFIX-out
          date +%s >> /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-step-stamps.txt
          sudo unshare -n env PREFIX="$PREFIX" ALLOWED_PREFIX="$ALLOWED_PREFIX" ./run-ceremony.sh config.json /tmp/$PREFIX-stage /tmp/$PREFIX-out 2>&1 \
            | tee /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-ceremony.log
      - name: NON_CERTIFYING_SCRATCH evidence readability repair (ephemeral out tree only)
        if: always()
        run: |
          set -euo pipefail
          # run-8 defect-1: the ceremony and smoke write as root; the runner-side interpreter
          # check, marker guard, and evidence upload must read everything (run 8 lost the whole
          # evidence artifact to a zip EACCES on root-owned ovmf-debug.log). Ephemeral CI output
          # only, never hashed inputs; every change logged; explicit per-type modes.
          [ -d /tmp/$PREFIX-out ] || { echo "out dir absent (nothing to repair)"; exit 0; }
          # peer N6: same hash-repair-rehash contract as the ceremony EXIT trap - the repair
          # must never alter evidence BYTES; chown-to-runner preferred over world readability
          # (N2). The before-hash runs under sudo: pre-repair files may be root-only-readable
          # (the run-8 EACCES case); the content hashed is identical either way.
          # peer pushed-byte review (4): the find runs under sudo too - a root-only
          # DIRECTORY would silently shrink a runner-side find's coverage.
          before=$(sudo find /tmp/$PREFIX-out -type f -print0 | sort -z | sudo xargs -0 -r sha256sum)
          mode=chmod
          if sudo chown -R "$(id -u):$(id -g)" /tmp/$PREFIX-out; then mode=chown
          else echo "W_EVIDENCE_REPAIR_CHOWN chown failed rc=$? - falling back to chmod"; fi
          if [ "$mode" = chmod ]; then
            find /tmp/$PREFIX-out -type d ! -perm -005 -print -exec sudo chmod o+rx {} +
            find /tmp/$PREFIX-out -type f ! -perm -004 -print -exec sudo chmod o+r {} +
          fi
          after=$(find /tmp/$PREFIX-out -type f -print0 | sort -z | xargs -0 -r sha256sum)
          [ "$before" = "$after" ] || { echo "E_EVIDENCE_HASH_DRIFT readability repair altered evidence bytes"; exit 96; }
          echo "evidence readability repair ($mode): $(printf '%s' "$after" | grep -c . || true) files, content hashes unchanged"
          # peer N1b: sockets are invisible to find -type f and un-uploadable - sweep the
          # whole evidence tree for any socket (or stray non-regular file) and fail closed.
          if [ -n "$(find /tmp/$PREFIX-out ! -type f ! -type d -print -quit)" ]; then
            echo "E_EVIDENCE_NONREGULAR non-regular file in evidence tree:"; find /tmp/$PREFIX-out ! -type f ! -type d -print; exit 94
          fi
          echo "evidence socket sweep: only regular files+dirs under /tmp/$PREFIX-out"
          # peer N9 + run-11 single-list: the manifest covers EXACTLY the uploaded paths -
          # both iterate the ONE shared EVIDENCE_UPLOAD_PATHS list (YAML anchor at the
          # workflow env block; the upload step aliases the same anchor), so drift between
          # upload and manifest is impossible by construction. Directories expand to their
          # files; absent members (failed-early runs) are noted, never silently skipped.
          man=$(mktemp)
          { while IFS= read -r p; do
              if [ -z "$p" ]; then continue; fi
              if [ -d "$p" ]; then find "$p" -type f -print0
              elif [ -f "$p" ]; then printf '%s\0' "$p"; fi
            done <<< "$EVIDENCE_UPLOAD_PATHS"
          } | sort -z | sudo xargs -0 -r sha256sum > "$man"
          while IFS= read -r p; do
            if [ -z "$p" ]; then continue; fi
            [ -d "$p" ] || [ -f "$p" ] || echo "ARTIFACT-DIGEST note: $p ABSENT this run (not in manifest)"
          done <<< "$EVIDENCE_UPLOAD_PATHS"
          sudo mv "$man" /tmp/$PREFIX-out/$PREFIX-evidence-manifest.txt
          sudo chown "$(id -u):$(id -g)" /tmp/$PREFIX-out/$PREFIX-evidence-manifest.txt
          echo "ARTIFACT-DIGEST paths=EVIDENCE_UPLOAD_PATHS(shared-list) manifest=$PREFIX-evidence-manifest.txt manifest_sha256=$(sha256sum /tmp/$PREFIX-out/$PREFIX-evidence-manifest.txt | cut -d' ' -f1) files=$(grep -c . /tmp/$PREFIX-out/$PREFIX-evidence-manifest.txt) run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT run_number=$GITHUB_RUN_NUMBER workflow=$GITHUB_WORKFLOW commit=$GITHUB_SHA ref=$GITHUB_REF"
      - name: NON_CERTIFYING_SCRATCH ceremony interpreter cross-check (addendum2 condition 2b)
        id: xcheck
        run: |
          set -euo pipefail
          grep '^host-python ' /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-host-inputs.txt > /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-expected-ceremony-python.txt
          diff /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-expected-ceremony-python.txt /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-ceremony-python.txt || { echo "E_CEREMONY_PYTHON_DRIFT"; exit 51; }
          echo "ceremony interpreter identical to the job record"
      - name: NON_CERTIFYING_SCRATCH cross-check strictness (peer run-12 C4-addendum)
        if: success()
        env:
          CEREMONY_OUTCOME: ${{ steps.ceremony.outcome }}
          XCHECK_OUTCOME: ${{ steps.xcheck.outcome }}
        run: |
          set -euo pipefail
          # a green ceremony MUST have been followed by a completed interpreter cross-check
          if [ "$CEREMONY_OUTCOME" = "success" ] && [ "$XCHECK_OUTCOME" != "success" ]; then
            echo "E_XCHECK_SKIPPED green ceremony without a completed interpreter cross-check"; exit 97
          fi
          echo "cross-check strictness: ceremony=$CEREMONY_OUTCOME xcheck=$XCHECK_OUTCOME"
      - name: NON_CERTIFYING_SCRATCH forbidden-marker guard
        if: '!cancelled()'
        run: |
          set -euo pipefail
          # C4 stand-down: a run cancelled before staging has no evidence tree to scan
          if [ ! -d /tmp/$PREFIX-out ]; then
            echo "marker guard stand-down: evidence tree absent (cancelled before staging)"; exit 0
          fi
          # fail-closed form: explicit if, fixed-string binary-inclusive scan (-a -F) of the
          # ENTIRE evidence tree (which includes the tee'd ceremony log), then a top-level
          # prefix guard so no un-prefixed path can sit next to the prefixed evidence.
          set +e
          GUARD_OUT=$(grep -r -a -F -l "OVMF_CI_SECURE_BOOT_UKI_PASS" /tmp/$PREFIX-out)
          GUARD_RC=$?
          set -e
          if [ "$GUARD_RC" -eq 0 ]; then
            echo "E_FORBIDDEN_MARKER_IN_EVIDENCE"; printf '%s\n' "$GUARD_OUT"; exit 94
          fi
          if [ "$GUARD_RC" -ne 1 ]; then
            echo "E_MARKER_GUARD_RC rc=$GUARD_RC (grep rc 1 = pass; anything else = fail)"; exit 94
          fi
          if [ -n "$(find /tmp/$PREFIX-out -mindepth 1 -maxdepth 1 ! -name 'NON_CERTIFYING_SCRATCH*' -print -quit)" ]; then
            echo "E_UNPREFIXED_TOPLEVEL_EVIDENCE"; exit 94
          fi
      - name: zero-private-key evidence gate K2 before evidence upload (peer run-12 K4)
        id: k2gate-evidence
        if: '!cancelled()'
        env:
          SCAN_PATHS: ${{ env.EVIDENCE_UPLOAD_PATHS }}
        run: |
          set -euo pipefail
          # K2 (peer run-12 K4 containment): fail closed if any private-key material stands
          # under ANY evidence upload path - by NAME (*.key/*.pem/*.p12/*.pfx) or CONTENT
          # (PEM "PRIVATE KEY" markers, PKCS#8/RSA DER key headers). Upload only if this passed.
          printf '%s\n' "$SCAN_PATHS" > /tmp/$PREFIX-k2-paths.txt
          python3 - /tmp/$PREFIX-k2-paths.txt <<'PYK'
          import sys, os, re
          paths = [l.strip() for l in open(sys.argv[1]) if l.strip()]
          namehit, conthit, linkhit = [], [], []
          pem = b"PRIVATE KEY"
          der_rsa = re.compile(rb"\x30\x82..\x02\x01\x00\x02\x82", re.S)
          der_p8 = re.compile(rb"\x30\x82..\x02\x01\x00\x30", re.S)
          def scan_file(p):
              if re.search(r"\.(key|pem|p12|pfx)$", os.path.basename(p), re.I):
                  namehit.append(p); return
              b = open(p, "rb").read()
              if pem in b or der_rsa.search(b) or der_p8.search(b):
                  conthit.append(p)
          for p in paths:
              if os.path.islink(p):
                  linkhit.append(p); continue
              if os.path.isfile(p):
                  scan_file(p)
              elif os.path.isdir(p):
                  for base, dirs, files in os.walk(p):
                      for dn in dirs:
                          if os.path.islink(os.path.join(base, dn)):
                              linkhit.append(os.path.join(base, dn))
                      for fn in files:
                          full = os.path.join(base, fn)
                          if os.path.islink(full):
                              linkhit.append(full); continue
                          scan_file(full)
          if linkhit:
              print("E_SYMLINK_IN_EVIDENCE symlinks=%r" % linkhit[:3])
              sys.exit(94)
          if namehit or conthit:
              print("E_PRIVATE_KEY_IN_EVIDENCE names=%r content=%r" % (namehit[:3], conthit[:3]))
              sys.exit(94)
          print("zero-private-key gate: clean across %d upload paths" % len(paths))
          PYK
      - name: NON_CERTIFYING_SCRATCH evidence upload (ephemeral CI artifact only)
        if: always() && steps.k2gate-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: NON_CERTIFYING_SCRATCH-evidence
          path: *evidence_upload_paths
          retention-days: 90
          if-no-files-found: error

  # Reviewer condition 4: reproduce once in a SECOND FRESH ENVIRONMENT (separate runner)
  # at the same canonical in-container path /build with identical pinned inputs. The FD
  # hash must equal the first runner's. The Build tree is kept and every module's
  # CodeView PDB path is parsed: all absolute paths must carry the /build/ prefix.
  rehearsal-env2:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    needs: rehearsal
    steps:
      - name: NON_CERTIFYING_SCRATCH ref+attempt fail-closed gate
        env:
          EV_CREATED: ${{ github.event.created }}
          EV_FORCED: ${{ github.event.forced }}
          EV_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [ "${{ github.run_attempt }}" = "1" ] || { echo "E_RERUN_FORBIDDEN run_attempt=${{ github.run_attempt }}"; exit 89; }
          case "${{ github.ref }}" in
            refs/heads/p3-scratch-*) : ;;
            *) echo "E_REF_MISMATCH ref=${{ github.ref }}"; exit 89 ;;
          esac
          # pushed-once gate (scratch form): force-push is forbidden; successive scratch commits are allowed
          [ "$EV_FORCED" = "false" ] || { echo "E_PUSHED_ONCE forced=$EV_FORCED"; exit 89; }
          mkdir -p /tmp/$PREFIX-out
          date +%s >> /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-step-stamps.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - name: workflow-argument existence gate (D2, fail-closed)
        run: |
          set -euo pipefail
          # D2 gate (reviewer ruling): every relative file/script argument used by later
          # steps must exist in the committed tree. Fixed list, fail-closed exit 88.
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          for f in             platform.lock.json             config.json             stage-platform.sh             make-shims.sh             preflight-check.py             build-ovmf-debug.sh             scan-pe-pdb-paths.py             build-enroll-app.sh             bwrap-argv.sh             enroll-predicate-check.py             rehearsal-enroll.sh             ../build-esp-image.sh             evidence/successor-signed.efi             run-ceremony.sh; do
            [ -e "$f" ] || { echo "E_WORKFLOW_ARG_MISSING $f"; exit 88; }
          done
      - name: NON_CERTIFYING_SCRATCH env2 host inputs declared (B3)
        run: |
          set -euo pipefail
          mkdir -p /tmp/$PREFIX-env2-evidence
          : > /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt
          for t in gcc make sha256sum; do
            p=$(command -v "$t")
            v=$("$t" --version 2>&1 | head -1 || true)
            h=$(sha256sum "$p" | cut -d' ' -f1)
            printf 'host-input %s %s %s %s\n' "$t" "$p" "$h" "$v" >> /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt
          done
          # python declared host input (batch1r3 addendum2 condition 2a): full interpreter identity
          pp=$(command -v python3)
          rp=$(realpath "$pp")
          case "$rp" in /usr/bin/*) ;; *) echo "E_PYTHON_HOST_PATH $rp"; exit 51;; esac
          [ -z "${VIRTUAL_ENV:-}" ] || { echo "E_PYTHON_VENV $VIRTUAL_ENV"; exit 51; }
          python3 - "$pp" "$rp" >> /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt <<'PYEOF'
          import sys, os, hashlib
          pp, rp = sys.argv[1], sys.argv[2]
          print("host-python path=" + pp)
          print("host-python realpath=" + rp)
          print("host-python realpath_sha256=" + hashlib.sha256(open(rp, "rb").read()).hexdigest())
          print("host-python version=" + repr(sys.version))
          print("host-python flags=" + repr(sys.flags))
          print("host-python pythonhashseed=" + os.environ.get("PYTHONHASHSEED", "<unset>"))
          PYEOF
          cat /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt
      - name: NON_CERTIFYING_SCRATCH env2 platform staging (only network phase)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          ./stage-platform.sh platform.lock.json /tmp/$PREFIX-stage-env2
      - name: NON_CERTIFYING_SCRATCH env2 userns/bwrap preflight (staged, lock-verified bwrap)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          SHIMS_LOG=/tmp/$PREFIX-out/$PREFIX-env2-make-shims.log
          mkdir -p /tmp/$PREFIX-out
          if ./make-shims.sh /tmp/$PREFIX-stage-env2 /tmp/$PREFIX-stage-env2/shims >"$SHIMS_LOG" 2>&1; then
            cat "$SHIMS_LOG"
          else
            rc=$?; cat "$SHIMS_LOG"; echo "E_ENV2_SHIMS make-shims.sh rc=$rc log=$SHIMS_LOG"; exit 97
          fi
          REALWORK=$(mktemp -d /tmp/$PREFIX-env2-preflight-realwork.XXXXXX)
          rc=0
          out=$(./bwrap-argv.sh canonical /tmp/$PREFIX-stage-env2/shims/bwrap "$REALWORK" -- true 2>&1) || rc=$?
          rm -rf "$REALWORK"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -qiE 'create new namespace|creating new namespace|setting up [ug]id map|user namespace'; then
              echo "E_NO_USERNS: staged bwrap canonical-path mechanism unavailable on this runner"
              exit 91
            fi
            echo "E_PREFLIGHT_NS_EXEC: staged bwrap namespace test failed (rc=$rc)"
            exit 91
          fi
      - name: NON_CERTIFYING_SCRATCH env2 single canonical-path reproduction
        timeout-minutes: 150
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          CANON_REALWORK=/var/tmp/$PREFIX-env2-work CANON_SINGLE=1 \
            ./build-ovmf-debug.sh /tmp/$PREFIX-stage-env2 /tmp/$PREFIX-ovmf-env2
          # condition 5: parse EVERY module .efi PDB path in the preserved Build tree
          # (batch1r3 C6/T3 F10: scan root is exactly work/edk2/Build; module count is pinned)
          SCAN_OUT=$(python3 scan-pe-pdb-paths.py /var/tmp/$PREFIX-env2-work/work/edk2/Build /build/ 2>&1)
          printf '%s\n' "$SCAN_OUT"
          MODS=$(printf '%s\n' "$SCAN_OUT" | sed -n 's/^scanned \([0-9][0-9]*\) PE files.*/\1/p')
          [ "$MODS" = "366" ] || { echo "E_ENV2_SCAN_COUNT modules=$MODS (pinned 366)"; exit 92; }
          printf '%s\n' "$SCAN_OUT" > /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-pdb-scan.txt
      - name: NON_CERTIFYING_SCRATCH env2 enroll-app rebuild (C2)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          sudo unshare -n ./build-enroll-app.sh /tmp/$PREFIX-stage-env2 /tmp/$PREFIX-app-env2-a /tmp/$PREFIX-app-env2-b
          cmp /tmp/$PREFIX-app-env2-a/enroll-app.efi /tmp/$PREFIX-app-env2-b/enroll-app.efi
          HA=$(sha256sum /tmp/$PREFIX-app-env2-a/enroll-app.efi | cut -d' ' -f1)
          [ "$HA" = "540b4fa3990f998cb803160482bd50e9670a47da3d534acc3ade91364a85f3ee" ] || { echo "E_APP_PIN_MISMATCH $HA"; exit 46; }
