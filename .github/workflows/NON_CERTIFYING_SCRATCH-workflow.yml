          [ "$rc" = "97" ] && grep -F "E_CHECKOUT_MUTATED unexpected untracked path: $R/__pycache__" "$T/pyc.log" > /dev/null \
            || { echo "E_GATETEST pycache case rc=$rc"; cat "$T/pyc.log"; exit 97; }
          rm -rf "$R/__pycache__"
