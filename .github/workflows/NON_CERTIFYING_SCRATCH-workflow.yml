      - name: NON_CERTIFYING_SCRATCH env2 cross-runner byte-identity gate
        run: |
          set -euo pipefail
          H1=$(grep -- "-ovmf-a/OVMF_CODE.fd" /tmp/$PREFIX-fw1/$PREFIX-fw-hashes.txt | cut -d' ' -f1)
          H2=$(sha256sum /tmp/$PREFIX-ovmf-env2/OVMF_CODE.fd | cut -d' ' -f1)
          [ "$H1" = "$H2" ] || { echo "E_ENV2_HASH_MISMATCH $H1 $H2"; exit 93; }
          A1=$(grep -- "-app-a/enroll-app.efi" /tmp/$PREFIX-fw1/$PREFIX-fw-hashes.txt | cut -d' ' -f1)
          A2=$(sha256sum /tmp/$PREFIX-app-env2-a/enroll-app.efi | cut -d' ' -f1)
          [ "$A1" = "$A2" ] || { echo "E_ENV2_APP_MISMATCH $A1 $A2"; exit 93; }
          E1=$(grep -- "-esp-a/c5-root-admitter-uki-v3-esp.raw" /tmp/$PREFIX-fw1/$PREFIX-fw-hashes.txt | cut -d' ' -f1)
          E2=$(sha256sum /tmp/$PREFIX-esp-env2-a/c5-root-admitter-uki-v3-esp.raw | cut -d' ' -f1)
          [ "$E1" = "$E2" ] || { echo "E_ENV2_ESP_MISMATCH $E1 $E2"; exit 93; }
          echo "env2 reproduction byte-identical across runners at canonical /build (firmware + enroll app + ESP image)"
      - name: NON_CERTIFYING_SCRATCH env2 evidence manifest + digest (peer N9)
        run: |
          set -euo pipefail
          # peer N9 + run-11 single-list: env2 manifest members come from the ONE shared
          # ENV2_EVIDENCE_UPLOAD_PATHS list (workflow env anchor; upload aliases it below).
          if [ -n "$(sudo find /tmp/$PREFIX-env2-evidence ! -type f ! -type d -print -quit)" ]; then
            echo "E_EVIDENCE_NONREGULAR non-regular file in env2 evidence tree:"; sudo find /tmp/$PREFIX-env2-evidence ! -type f ! -type d -print; exit 94
          fi
          man=$(mktemp)
          { while IFS= read -r p; do
              if [ -z "$p" ]; then continue; fi
              if [ -d "$p" ]; then sudo find "$p" -type f -print0
              elif [ -f "$p" ]; then printf '%s\0' "$p"; fi
            done <<< "$ENV2_EVIDENCE_UPLOAD_PATHS"
          } | sort -z | sudo xargs -0 -r sha256sum > "$man"
          while IFS= read -r p; do
            if [ -z "$p" ]; then continue; fi
            [ -d "$p" ] || [ -f "$p" ] || echo "ARTIFACT-DIGEST note: $p ABSENT this run (not in manifest)"
          done <<< "$ENV2_EVIDENCE_UPLOAD_PATHS"
          sudo mv "$man" /tmp/$PREFIX-env2-evidence/$PREFIX-env2-evidence-manifest.txt
          sudo chown "$(id -u):$(id -g)" /tmp/$PREFIX-env2-evidence/$PREFIX-env2-evidence-manifest.txt
          echo "ARTIFACT-DIGEST paths=ENV2_EVIDENCE_UPLOAD_PATHS(shared-list) manifest=$PREFIX-env2-evidence-manifest.txt manifest_sha256=$(sha256sum /tmp/$PREFIX-env2-evidence/$PREFIX-env2-evidence-manifest.txt | cut -d' ' -f1) files=$(grep -c . /tmp/$PREFIX-env2-evidence/$PREFIX-env2-evidence-manifest.txt) run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT run_number=$GITHUB_RUN_NUMBER workflow=$GITHUB_WORKFLOW commit=$GITHUB_SHA ref=$GITHUB_REF"
      - name: zero-private-key evidence gate K2 before env2 evidence upload (peer run-12 K4)
        id: k2gate-env2
        if: '!cancelled()'
        env:
          SCAN_PATHS: ${{ env.ENV2_EVIDENCE_UPLOAD_PATHS }}
        run: |
          set -euo pipefail
          # K2 (peer run-12 K4 containment): fail closed if any private-key material stands
          # under ANY evidence upload path - by NAME (*.key/*.pem/*.p12/*.pfx) or CONTENT
          # (PEM "PRIVATE KEY" markers, PKCS#8/RSA DER key headers). Upload only if this passed.
          printf '%s\n' "$SCAN_PATHS" > /tmp/$PREFIX-k2-paths.txt
          python3 - /tmp/$PREFIX-k2-paths.txt <<'PYK'
          import sys, os, re
          paths = [l.strip() for l in open(sys.argv[1]) if l.strip()]
          namehit, conthit, linkhit = [], [], []
          pem = b"PRIVATE KEY"
          der_rsa = re.compile(rb"\x30\x82..\x02\x01\x00\x02\x82", re.S)
          der_p8 = re.compile(rb"\x30\x82..\x02\x01\x00\x30", re.S)
          def scan_file(p):
              if re.search(r"\.(key|pem|p12|pfx)$", os.path.basename(p), re.I):
                  namehit.append(p); return
              b = open(p, "rb").read()
              if pem in b or der_rsa.search(b) or der_p8.search(b):
                  conthit.append(p)
          for p in paths:
              if os.path.islink(p):
                  linkhit.append(p); continue
              if os.path.isfile(p):
                  scan_file(p)
              elif os.path.isdir(p):
                  for base, dirs, files in os.walk(p):
                      for dn in dirs:
                          if os.path.islink(os.path.join(base, dn)):
                              linkhit.append(os.path.join(base, dn))
                      for fn in files:
                          full = os.path.join(base, fn)
                          if os.path.islink(full):
                              linkhit.append(full); continue
                          scan_file(full)
          if linkhit:
              print("E_SYMLINK_IN_EVIDENCE symlinks=%r" % linkhit[:3])
              sys.exit(94)
          if namehit or conthit:
              print("E_PRIVATE_KEY_IN_EVIDENCE names=%r content=%r" % (namehit[:3], conthit[:3]))
              sys.exit(94)
          print("zero-private-key gate: clean across %d upload paths" % len(paths))
          PYK
      - name: NON_CERTIFYING_SCRATCH env2 evidence upload (ephemeral CI artifact only)
        if: always() && steps.k2gate-env2.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: NON_CERTIFYING_SCRATCH-env2-evidence
          path: *env2_evidence_upload_paths
          retention-days: 90
          if-no-files-found: error
