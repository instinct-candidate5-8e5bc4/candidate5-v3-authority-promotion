          [ "$EV_FORCED" = "false" ] || { echo "E_PUSHED_ONCE forced=$EV_FORCED"; exit 89; }
          mkdir -p /tmp/$PREFIX-out
          date +%s >> /tmp/$PREFIX-out/NON_CERTIFYING_SCRATCH-step-stamps.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - name: workflow-argument existence gate (D2, fail-closed)
        run: |
          set -euo pipefail
          # D2 gate (reviewer ruling): every relative file/script argument used by later
          # steps must exist in the committed tree. Fixed list, fail-closed exit 88.
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          for f in             platform.lock.json             config.json             stage-platform.sh             make-shims.sh             preflight-check.py             build-ovmf-debug.sh             scan-pe-pdb-paths.py             build-enroll-app.sh             bwrap-argv.sh             enroll-predicate-check.py             rehearsal-enroll.sh             ../build-esp-image.sh             evidence/successor-signed.efi             run-ceremony.sh             config_schema.py             bind-fixture-certs.sh; do
            [ -e "$f" ] || { echo "E_WORKFLOW_ARG_MISSING $f"; exit 88; }
          done
      - name: NON_CERTIFYING_SCRATCH env2 host inputs declared (B3)
        run: |
          set -euo pipefail
          mkdir -p /tmp/$PREFIX-env2-evidence
          : > /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt
          for t in gcc make sha256sum; do
            p=$(command -v "$t")
            v=$("$t" --version 2>&1 | head -1 || true)
            h=$(sha256sum "$p" | cut -d' ' -f1)
            printf 'host-input %s %s %s %s\n' "$t" "$p" "$h" "$v" >> /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt
          done
          # python declared host input (batch1r3 addendum2 condition 2a): full interpreter identity
          pp=$(command -v python3)
          rp=$(realpath "$pp")
          case "$rp" in /usr/bin/*) ;; *) echo "E_PYTHON_HOST_PATH $rp"; exit 51;; esac
          [ -z "${VIRTUAL_ENV:-}" ] || { echo "E_PYTHON_VENV $VIRTUAL_ENV"; exit 51; }
          python3 - "$pp" "$rp" >> /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt <<'PYEOF'
          import sys, os, hashlib
          pp, rp = sys.argv[1], sys.argv[2]
          print("host-python path=" + pp)
          print("host-python realpath=" + rp)
          print("host-python realpath_sha256=" + hashlib.sha256(open(rp, "rb").read()).hexdigest())
          print("host-python version=" + repr(sys.version))
          print("host-python flags=" + repr(sys.flags))
          print("host-python pythonhashseed=" + os.environ.get("PYTHONHASHSEED", "<unset>"))
          PYEOF
          cat /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt
      - name: NON_CERTIFYING_SCRATCH env2 platform staging (only network phase)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          # D14-1: the shared helper must be importable by EVERY caller - smoke the
          # real import path first so a filename/module mistake dies named, never as
          # a bare ModuleNotFoundError traceback in staging
          python3 -c "import sys, os; sys.path.insert(0, os.getcwd()); from fetch_locked import fetch_locked; print('fetch_locked import smoke OK')" || { echo "E_FETCH_HELPER_IMPORT fetch_locked not importable from the caller path"; exit 97; }
          ./stage-platform.sh platform.lock.json /tmp/$PREFIX-stage-env2
      - name: NON_CERTIFYING_SCRATCH env2 userns/bwrap preflight (staged, lock-verified bwrap)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          SHIMS_LOG=/tmp/$PREFIX-out/$PREFIX-env2-make-shims.log
          mkdir -p /tmp/$PREFIX-out
          if ./make-shims.sh /tmp/$PREFIX-stage-env2 /tmp/$PREFIX-stage-env2/shims >"$SHIMS_LOG" 2>&1; then
            cat "$SHIMS_LOG"
          else
            rc=$?; cat "$SHIMS_LOG"; echo "E_ENV2_SHIMS make-shims.sh rc=$rc log=$SHIMS_LOG"; exit 97
          fi
          REALWORK=$(mktemp -d /tmp/$PREFIX-env2-preflight-realwork.XXXXXX)
          rc=0
          out=$(./bwrap-argv.sh canonical /tmp/$PREFIX-stage-env2/shims/bwrap "$REALWORK" -- true 2>&1) || rc=$?
          rm -rf "$REALWORK"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -qiE 'create new namespace|creating new namespace|setting up [ug]id map|user namespace'; then
              echo "E_NO_USERNS: staged bwrap canonical-path mechanism unavailable on this runner"
              exit 91
            fi
            echo "E_PREFLIGHT_NS_EXEC: staged bwrap namespace test failed (rc=$rc)"
            exit 91
          fi
      - name: NON_CERTIFYING_SCRATCH env2 single canonical-path reproduction
        timeout-minutes: 150
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          CANON_REALWORK=/var/tmp/$PREFIX-env2-work CANON_SINGLE=1 \
            ./build-ovmf-debug.sh /tmp/$PREFIX-stage-env2 /tmp/$PREFIX-ovmf-env2
          # condition 5: parse EVERY module .efi PDB path in the preserved Build tree
          # (batch1r3 C6/T3 F10: scan root is exactly work/edk2/Build; module count is pinned)
          SCAN_OUT=$(python3 scan-pe-pdb-paths.py /var/tmp/$PREFIX-env2-work/work/edk2/Build /build/ 2>&1)
          printf '%s\n' "$SCAN_OUT"
          MODS=$(printf '%s\n' "$SCAN_OUT" | sed -n 's/^scanned \([0-9][0-9]*\) PE files.*/\1/p')
          [ "$MODS" = "366" ] || { echo "E_ENV2_SCAN_COUNT modules=$MODS (pinned 366)"; exit 92; }
          printf '%s\n' "$SCAN_OUT" > /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-pdb-scan.txt
      - name: NON_CERTIFYING_SCRATCH env2 enroll-app rebuild (C2)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          sudo unshare -n ./build-enroll-app.sh /tmp/$PREFIX-stage-env2 /tmp/$PREFIX-app-env2-a /tmp/$PREFIX-app-env2-b
          cmp /tmp/$PREFIX-app-env2-a/enroll-app.efi /tmp/$PREFIX-app-env2-b/enroll-app.efi
          HA=$(sha256sum /tmp/$PREFIX-app-env2-a/enroll-app.efi | cut -d' ' -f1)
          [ "$HA" = "dccc181800051a80df93b5ac2d280d3ff292d4193f7c223467e27df765e1dbbb" ] || { echo "E_APP_PIN_MISMATCH $HA"; exit 46; }
          sha256sum /tmp/$PREFIX-app-env2-a/enroll-app.efi > /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-app-hash.txt
      - name: NON_CERTIFYING_SCRATCH env2 ESP image reproduction (peer gap close - ESP is a frozen output)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          export PATH="/tmp/$PREFIX-stage-env2/shims:$PATH"
          sudo unshare -n env PATH="$PATH" ../build-esp-image.sh evidence/successor-signed.efi /tmp/$PREFIX-esp-env2-a
          sudo unshare -n env PATH="$PATH" ../build-esp-image.sh evidence/successor-signed.efi /tmp/$PREFIX-esp-env2-b
          cmp /tmp/$PREFIX-esp-env2-a/c5-root-admitter-uki-v3-esp.raw /tmp/$PREFIX-esp-env2-b/c5-root-admitter-uki-v3-esp.raw
          HE=$(sha256sum /tmp/$PREFIX-esp-env2-a/c5-root-admitter-uki-v3-esp.raw | cut -d' ' -f1)
          [ "$HE" = "2bfa621238890890765c9636f99dabfb46233bfa626afb580ce33e65858019c9" ] || { echo "E_ESP_PIN_MISMATCH $HE"; exit 46; }
          sha256sum /tmp/$PREFIX-esp-env2-a/c5-root-admitter-uki-v3-esp.raw > /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-esp-hash.txt
      - name: NON_CERTIFYING_SCRATCH env2 accepted-firmware pins + runner-1 hash echo
        run: |
          set -euo pipefail
          HC=$(sha256sum /tmp/$PREFIX-ovmf-env2/OVMF_CODE.fd | cut -d' ' -f1)
          [ "$HC" = "fc150336fce10eb5508fa440cdf7300622c8c3ac71f2fbe10a0731422b9cef24" ] || { echo "E_CODE_PIN_MISMATCH $HC"; exit 95; }
          [ "$(stat -c%s /tmp/$PREFIX-ovmf-env2/OVMF_CODE.fd)" = "3653632" ] || { echo "E_CODE_PIN_SIZE"; exit 95; }
          HV=$(sha256sum /tmp/$PREFIX-ovmf-env2/OVMF_VARS.fd | cut -d' ' -f1)
          [ "$HV" = "5d2ac383371b408398accee7ec27c8c09ea5b74a0de0ceea6513388b15be5d1e" ] || { echo "E_VARS_PIN_MISMATCH $HV"; exit 95; }
          [ "$(stat -c%s /tmp/$PREFIX-ovmf-env2/OVMF_VARS.fd)" = "540672" ] || { echo "E_VARS_PIN_SIZE"; exit 95; }
          sha256sum /tmp/$PREFIX-ovmf-env2/OVMF_CODE.fd /tmp/$PREFIX-ovmf-env2/OVMF_VARS.fd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: NON_CERTIFYING_SCRATCH-fw-hashes
          path: /tmp/NON_CERTIFYING_SCRATCH-fw1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: NON_CERTIFYING_SCRATCH-evidence
          path: /tmp/NON_CERTIFYING_SCRATCH-env1-evidence
      - name: NON_CERTIFYING_SCRATCH env2 host-inputs cross-job diff (B3)
        run: |
          set -euo pipefail
          diff /tmp/$PREFIX-env1-evidence/NON_CERTIFYING_SCRATCH-out/NON_CERTIFYING_SCRATCH-host-inputs.txt \
               /tmp/$PREFIX-env2-evidence/NON_CERTIFYING_SCRATCH-env2-host-inputs.txt \
            || { echo "E_HOST_INPUTS_DRIFT"; exit 98; }
          echo "host inputs identical across jobs"
      - name: NON_CERTIFYING_SCRATCH env2 cross-runner byte-identity gate
        run: |
          set -euo pipefail
          H1=$(grep -- "-ovmf-a/OVMF_CODE.fd" /tmp/$PREFIX-fw1/$PREFIX-fw-hashes.txt | cut -d' ' -f1)
          H2=$(sha256sum /tmp/$PREFIX-ovmf-env2/OVMF_CODE.fd | cut -d' ' -f1)
          [ "$H1" = "$H2" ] || { echo "E_ENV2_HASH_MISMATCH $H1 $H2"; exit 93; }
          A1=$(grep -- "-app-a/enroll-app.efi" /tmp/$PREFIX-fw1/$PREFIX-fw-hashes.txt | cut -d' ' -f1)
          A2=$(sha256sum /tmp/$PREFIX-app-env2-a/enroll-app.efi | cut -d' ' -f1)
          [ "$A1" = "$A2" ] || { echo "E_ENV2_APP_MISMATCH $A1 $A2"; exit 93; }
          E1=$(grep -- "-esp-a/c5-root-admitter-uki-v3-esp.raw" /tmp/$PREFIX-fw1/$PREFIX-fw-hashes.txt | cut -d' ' -f1)
          E2=$(sha256sum /tmp/$PREFIX-esp-env2-a/c5-root-admitter-uki-v3-esp.raw | cut -d' ' -f1)
          [ "$E1" = "$E2" ] || { echo "E_ENV2_ESP_MISMATCH $E1 $E2"; exit 93; }
          echo "env2 reproduction byte-identical across runners at canonical /build (firmware + enroll app + ESP image)"
      - name: NON_CERTIFYING_SCRATCH env2 evidence manifest + digest (peer N9)
        run: |
          set -euo pipefail
          # peer N9 + run-11 single-list: env2 manifest members come from the ONE shared
          # ENV2_EVIDENCE_UPLOAD_PATHS list (workflow env anchor; upload aliases it below).
          if [ -n "$(sudo find /tmp/$PREFIX-env2-evidence ! -type f ! -type d -print -quit)" ]; then
            echo "E_EVIDENCE_NONREGULAR non-regular file in env2 evidence tree:"; sudo find /tmp/$PREFIX-env2-evidence ! -type f ! -type d -print; exit 94
          fi
          man=$(mktemp)
          { while IFS= read -r p; do
              if [ -z "$p" ]; then continue; fi
              if [ -d "$p" ]; then sudo find "$p" -type f -print0
              elif [ -f "$p" ]; then printf '%s\0' "$p"; fi
            done <<< "$ENV2_EVIDENCE_UPLOAD_PATHS"
          } | sort -z | sudo xargs -0 -r sha256sum > "$man"
          while IFS= read -r p; do
            if [ -z "$p" ]; then continue; fi
            [ -d "$p" ] || [ -f "$p" ] || echo "ARTIFACT-DIGEST note: $p ABSENT this run (not in manifest)"
          done <<< "$ENV2_EVIDENCE_UPLOAD_PATHS"
          sudo mv "$man" /tmp/$PREFIX-env2-evidence/$PREFIX-env2-evidence-manifest.txt
          sudo chown "$(id -u):$(id -g)" /tmp/$PREFIX-env2-evidence/$PREFIX-env2-evidence-manifest.txt
          echo "ARTIFACT-DIGEST paths=ENV2_EVIDENCE_UPLOAD_PATHS(shared-list) manifest=$PREFIX-env2-evidence-manifest.txt manifest_sha256=$(sha256sum /tmp/$PREFIX-env2-evidence/$PREFIX-env2-evidence-manifest.txt | cut -d' ' -f1) files=$(grep -c . /tmp/$PREFIX-env2-evidence/$PREFIX-env2-evidence-manifest.txt) run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT run_number=$GITHUB_RUN_NUMBER workflow=$GITHUB_WORKFLOW commit=$GITHUB_SHA ref=$GITHUB_REF"
      - name: zero-private-key evidence gate K2 before env2 evidence upload (peer run-12 K4)
        id: k2gate-env2
        if: '!cancelled()'
        env:
          SCAN_PATHS: ${{ env.ENV2_EVIDENCE_UPLOAD_PATHS }}
        run: |
          set -euo pipefail
          # K2 (peer run-12 K4 containment): fail closed if any private-key material stands
          # under ANY evidence upload path - by NAME (*.key/*.pem/*.p12/*.pfx) or CONTENT
          # (PEM "PRIVATE KEY" markers, PKCS#8/RSA DER key headers). Upload only if this passed.
          printf '%s\n' "$SCAN_PATHS" "/tmp/$PREFIX-inrun" > /tmp/$PREFIX-k2-paths.txt
          python3 - /tmp/$PREFIX-k2-paths.txt <<'PYK'
          import sys, os, re
          paths = [l.strip() for l in open(sys.argv[1]) if l.strip()]
          namehit, conthit, linkhit = [], [], []
          pem = b"PRIVATE KEY"
          der_rsa = re.compile(rb"\x30\x82..\x02\x01\x00\x02\x82", re.S)
          der_p8 = re.compile(rb"\x30\x82..\x02\x01\x00\x30", re.S)
          scanned = [0]
          def _k2raise(e):
              print("E_K2_SWEEP_UNREADABLE %s" % e); sys.exit(94)
          def scan_file(p):
              scanned[0] += 1
              if re.search(r"\.(key|pem|p12|pfx)$", os.path.basename(p), re.I):
                  namehit.append(p); return
              b = open(p, "rb").read()
              if pem in b or der_rsa.search(b) or der_p8.search(b):
                  conthit.append(p)
          for p in paths:
              if os.path.islink(p):
                  linkhit.append(p); continue
              if os.path.isfile(p):
                  scan_file(p)
              elif os.path.isdir(p):
                  for base, dirs, files in os.walk(p, onerror=_k2raise):
                      for dn in dirs:
                          if os.path.islink(os.path.join(base, dn)):
                              linkhit.append(os.path.join(base, dn))
                      for fn in files:
                          full = os.path.join(base, fn)
                          if os.path.islink(full):
                              linkhit.append(full); continue
                          scan_file(full)
          if linkhit:
              print("E_SYMLINK_IN_EVIDENCE symlinks=%r" % linkhit[:3])
              sys.exit(94)
          if namehit or conthit:
              print("E_PRIVATE_KEY_IN_EVIDENCE names=%r content=%r" % (namehit[:3], conthit[:3]))
              sys.exit(94)
          if scanned[0] == 0:
              print("E_K2_SWEEP_EMPTY no files scanned across %d upload paths" % len(paths)); sys.exit(94)
          print("zero-private-key gate: clean across %d upload paths (scanned=%d)" % (len(paths), scanned[0]))
          PYK
      - name: NON_CERTIFYING_SCRATCH env2 evidence upload (ephemeral CI artifact only)
        if: always() && steps.k2gate-env2.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: NON_CERTIFYING_SCRATCH-env2-evidence
          path: *env2_evidence_upload_paths
          retention-days: 90
          if-no-files-found: error
      - name: env2 checkout immutability gate (end of job, frozen SHA)
        if: "!cancelled()"
        run: |
          set -euo pipefail
          R=docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          "$R/checkout-gate.sh" "$GITHUB_WORKSPACE" "$R/prep"
