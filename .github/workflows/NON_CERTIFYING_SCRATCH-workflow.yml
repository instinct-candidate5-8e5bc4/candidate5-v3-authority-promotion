          [ "$rc" = "97" ] && grep -F "E_CHECKOUT_MUTATED unexpected untracked path: $R/stray.txt" "$T/stray.log" > /dev/null \
            || { echo "E_GATETEST stray-file case rc=$rc"; cat "$T/stray.log"; exit 97; }
