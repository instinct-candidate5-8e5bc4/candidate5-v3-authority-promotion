# NON_CERTIFYING_REHEARSAL — pre-freeze rehearsal workflow (development evidence only).
# This workflow NEVER certifies anything. It must never emit OVMF_CI_SECURE_BOOT_UKI_PASS
# or any certification marker. Every artifact name begins NON_CERTIFYING_REHEARSAL.
# Trigger: push ONLY, exact branch filter p3-rehearsal-3 / p3-rehearsal-4 (no wildcards, no
# other events). Per GitHub Actions documentation a push runs the workflow file AT the pushed
# commit, including on non-default branches, so this file lives ONLY at .github/workflows/
# on the candidate commit (ONE copy; no default-branch registration, no docs/ copy).
# The two rehearsals are two separate fresh pushes of the SAME candidate SHA: first
# p3-rehearsal-3, then p3-rehearsal-4 only after -3 passes. No other commits to these refs.
# (Ref rotation per reviewer ruling after D2: p3-rehearsal-1 is spent at 02f3eab9 and
# p3-rehearsal-2 was never created; -1/-2 are removed so a stray push to a spent ref
# can never run.)
# Fail-closed: the first step of every job aborts the run unless github.run_attempt == 1 AND
# github.ref is exactly one of the two filtered refs. No re-run counts; any accidental run
# is preserved and reported. Every GitHub action is pinned to a full-length commit SHA
# (reviewer condition 8; SHAs recorded in the deterministic manifest). bwrap is
# load-bearing for the canonical build path, so it comes ONLY from the hash-verified
# platform lock as a staged binary (never the host tool). KVM-only, fail-closed, no TCG.
# Public standard runner only ($0).
name: NON_CERTIFYING_REHEARSAL
on:
  push:
    branches: [p3-rehearsal-3, p3-rehearsal-4]
permissions: {}
env:
  # #15 (run-14 verdict): importing the shared fetch_locked helper must never write
  # __pycache__ into the frozen checkout; pairs with the end-of-job immutability gate.
  PYTHONDONTWRITEBYTECODE: "1"
  PREFIX: NON_CERTIFYING_REHEARSAL
  # peer adjudication (1): per-workflow singleton allowlist; scripts fail closed on mismatch.
  ALLOWED_PREFIX: NON_CERTIFYING_REHEARSAL
  # peer run-11 single-list: the evidence upload paths AND the manifest members come from
  # this ONE shared list - the upload step references the same YAML anchor, so the two can
  # never drift. Directories expand to their files at manifest time.
  EVIDENCE_UPLOAD_PATHS: &evidence_upload_paths |
    /tmp/NON_CERTIFYING_REHEARSAL-out/
    /tmp/NON_CERTIFYING_REHEARSAL-fw-hashes.txt
    /tmp/NON_CERTIFYING_REHEARSAL-ovmf-a/basetools-build-pass1.log
    /tmp/NON_CERTIFYING_REHEARSAL-ovmf-a/basetools-build-pass2.log
    /tmp/NON_CERTIFYING_REHEARSAL-hostile-out/basetools-build.log
  # peer run-11: the env2 job gets the same single-list treatment (same drift shape).
  ENV2_EVIDENCE_UPLOAD_PATHS: &env2_evidence_upload_paths |
    /tmp/NON_CERTIFYING_REHEARSAL-env2-evidence/
    /tmp/NON_CERTIFYING_REHEARSAL-ovmf-env2/basetools-build-pass1.log
jobs:
  rehearsal:
    # ubuntu-22.04 pinned: the canonical-path mechanism (build-ovmf-debug.sh) needs
    # unprivileged user namespaces for bwrap; ubuntu-24.04 runners restrict them via
    # AppArmor.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: NON_CERTIFYING_REHEARSAL ref+attempt fail-closed gate
        env:
          EV_CREATED: ${{ github.event.created }}
          EV_FORCED: ${{ github.event.forced }}
          EV_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [ "${{ github.run_attempt }}" = "1" ] || { echo "E_RERUN_FORBIDDEN run_attempt=${{ github.run_attempt }}"; exit 89; }
          case "${{ github.ref }}" in
            refs/heads/p3-rehearsal-3|refs/heads/p3-rehearsal-4) : ;;
            *) echo "E_REF_MISMATCH ref=${{ github.ref }}"; exit 89 ;;
          esac
          # pushed-once gate (T3 F5): the ref must be created by THIS push, never force-pushed
          [ "$EV_CREATED" = "true" ] || { echo "E_PUSHED_ONCE created=$EV_CREATED"; exit 89; }
          [ "$EV_FORCED" = "false" ] || { echo "E_PUSHED_ONCE forced=$EV_FORCED"; exit 89; }
          [ "$EV_BEFORE" = "0000000000000000000000000000000000000000" ] || { echo "E_PUSHED_ONCE before=$EV_BEFORE"; exit 89; }
          mkdir -p /tmp/$PREFIX-out
          date +%s >> /tmp/$PREFIX-out/NON_CERTIFYING_REHEARSAL-step-stamps.txt
      - name: NON_CERTIFYING_REHEARSAL kvm fail-closed check
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then echo "E_NO_KVM"; exit 90; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - name: workflow-argument existence gate (D2, fail-closed)
        run: |
          set -euo pipefail
          # D2 gate (reviewer ruling): every relative file/script argument used by later
          # steps must exist in the committed tree. Fixed list, fail-closed exit 88.
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          for f in             platform.lock.json             config.json             stage-platform.sh             make-shims.sh             test-c-sign-confinement.py             test-enroll-predicate-env.py             test-cert-positive-guard.py             test-k2-sweeps.py             test-inrun-writes.py             test-inrun-stale-path.py             test-stale-state-committed.py             test-heredoc-structure.py             test-h5-planted-errset.py             preflight-check.py             build-ovmf-debug.sh             scan-pe-pdb-paths.py             build-enroll-app.sh             bwrap-argv.sh             enroll-predicate-check.py             rehearsal-enroll.sh             ../build-esp-image.sh             evidence/successor-signed.efi             run-ceremony.sh             qemu-smoke.sh; do
            [ -e "$f" ] || { echo "E_WORKFLOW_ARG_MISSING $f"; exit 88; }
          done
      - name: NON_CERTIFYING_REHEARSAL host inputs declared (B3)
        run: |
          set -euo pipefail
          mkdir -p /tmp/$PREFIX-out
          : > /tmp/$PREFIX-out/NON_CERTIFYING_REHEARSAL-host-inputs.txt
          for t in gcc make sha256sum; do
            p=$(command -v "$t")
            v=$("$t" --version 2>&1 | head -1 || true)
            h=$(sha256sum "$p" | cut -d' ' -f1)
            printf 'host-input %s %s %s %s\n' "$t" "$p" "$h" "$v" >> /tmp/$PREFIX-out/NON_CERTIFYING_REHEARSAL-host-inputs.txt
          done
          # python declared host input (batch1r3 addendum2 condition 2a): full interpreter identity
          pp=$(command -v python3)
          rp=$(realpath "$pp")
          case "$rp" in /usr/bin/*) ;; *) echo "E_PYTHON_HOST_PATH $rp"; exit 51;; esac
          [ -z "${VIRTUAL_ENV:-}" ] || { echo "E_PYTHON_VENV $VIRTUAL_ENV"; exit 51; }
          python3 - "$pp" "$rp" >> /tmp/$PREFIX-out/NON_CERTIFYING_REHEARSAL-host-inputs.txt <<'PYEOF'
          import sys, os, hashlib
          pp, rp = sys.argv[1], sys.argv[2]
          print("host-python path=" + pp)
          print("host-python realpath=" + rp)
          print("host-python realpath_sha256=" + hashlib.sha256(open(rp, "rb").read()).hexdigest())
          print("host-python version=" + repr(sys.version))
          print("host-python flags=" + repr(sys.flags))
          print("host-python pythonhashseed=" + os.environ.get("PYTHONHASHSEED", "<unset>"))
          PYEOF
          cat /tmp/$PREFIX-out/NON_CERTIFYING_REHEARSAL-host-inputs.txt
      - name: NON_CERTIFYING_REHEARSAL platform staging (only network phase)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          # D14-1: the shared helper must be importable by EVERY caller - smoke the
          # real import path first so a filename/module mistake dies named, never as
          # a bare ModuleNotFoundError traceback in staging
          python3 -c "import sys, os; sys.path.insert(0, os.getcwd()); from fetch_locked import fetch_locked; print('fetch_locked import smoke OK')" || { echo "E_FETCH_HELPER_IMPORT fetch_locked not importable from the caller path"; exit 97; }
          ./stage-platform.sh platform.lock.json /tmp/$PREFIX-stage
          # addendum2 condition 2: fetch the four lock-recorded index snapshots for the
          # byte-for-byte lockgen regeneration gate (inside the only network phase)
          mkdir -p /tmp/$PREFIX-lockgen-indices
          python3 - platform.lock.json "$PREFIX" <<'PYEOF'
          import json, hashlib, sys, os
          sys.path.insert(0, os.getcwd())
          from fetch_locked import fetch_locked
          lock = json.load(open("platform.lock.json"))
          for name, ent in sorted(lock["indices"].items()):
              # F-ruling: retry ONLY the lock-recorded URL through the shared helper
              # (transient-only, 3 attempts; mismatch/non-429-4xx fail at once named)
              data = None
              res = fetch_locked(ent["url"], name, "/tmp/" + sys.argv[2] + "-lockgen-indices/" + name + ".xz", ent["sha256"])
              data = open("/tmp/" + sys.argv[2] + "-lockgen-indices/" + name + ".xz", "rb").read()
              got = hashlib.sha256(data).hexdigest()
              if got != ent["sha256"]:
                  print("E_LOCKGEN_INDEX_MISMATCH", name, got)
                  raise SystemExit(52)
              open("/tmp/" + sys.argv[2] + "-lockgen-indices/" + name + ".xz", "wb").write(data)
              print("index", name, len(data), "bytes", got)
          PYEOF
      - name: NON_CERTIFYING_REHEARSAL userns/bwrap preflight (staged, lock-verified bwrap)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          SHIMS_LOG=/tmp/$PREFIX-out/$PREFIX-preflight-make-shims.log
          mkdir -p /tmp/$PREFIX-out
          if ./make-shims.sh /tmp/$PREFIX-stage /tmp/$PREFIX-stage/shims >"$SHIMS_LOG" 2>&1; then
            cat "$SHIMS_LOG"
          else
            rc=$?; cat "$SHIMS_LOG"; echo "E_PREFLIGHT_SHIMS make-shims.sh rc=$rc log=$SHIMS_LOG"; exit 97
          fi
          REALWORK=$(mktemp -d /tmp/$PREFIX-preflight-realwork.XXXXXX)
          rc=0
          out=$(./bwrap-argv.sh canonical /tmp/$PREFIX-stage/shims/bwrap "$REALWORK" -- true 2>&1) || rc=$?
          rm -rf "$REALWORK"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -qiE 'create new namespace|creating new namespace|setting up [ug]id map|user namespace'; then
              echo "E_NO_USERNS: staged bwrap canonical-path mechanism unavailable on this runner"
              exit 91
            fi
            echo "E_PREFLIGHT_NS_EXEC: staged bwrap namespace test failed (rc=$rc)"
            exit 91
          fi
      - name: NON_CERTIFYING_REHEARSAL lockgen byte-for-byte regeneration (addendum2 condition 2)
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          rm -rf /tmp/$PREFIX-lockgen && mkdir -p /tmp/$PREFIX-lockgen
          cp platform-lockgen.py /tmp/$PREFIX-lockgen/
          cp /tmp/$PREFIX-lockgen-indices/noble-main.xz /tmp/$PREFIX-lockgen-indices/noble-updates-main.xz /tmp/$PREFIX-lockgen-indices/noble-universe.xz /tmp/$PREFIX-lockgen-indices/noble-updates-universe.xz /tmp/$PREFIX-lockgen/
          (cd /tmp/$PREFIX-lockgen && python3 platform-lockgen.py)
          cmp /tmp/$PREFIX-lockgen/platform.lock.json platform.lock.json || { echo "E_LOCKGEN_NONDET"; exit 52; }
          echo "committed lockgen regenerates the committed lock byte-for-byte"
      - name: NON_CERTIFYING_REHEARSAL preflight static conformance
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          python3 preflight-check.py config.json /tmp/$PREFIX-stage
      - name: NON_CERTIFYING_REHEARSAL c-sign derivation/confinement negative tests (must-show)
        if: ${{ !cancelled() }}
        run: |
          set -eEuo pipefail
          trap '_rc=$?; echo "E_BASH_ERRTRAP csign-negtest line $LINENO rc=$_rc cmd: $BASH_COMMAND" >&2; exit 97' ERR
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          # peer 2026-09-24 B1 condition 5: the planted negatives are committed and
          # runnable; this log lands in the run evidence tree.
          mkdir -p /tmp/$PREFIX-out
          python3 test-c-sign-confinement.py 2>&1 | tee /tmp/$PREFIX-out/$PREFIX-csign-negtests.log
          python3 test-enroll-predicate-env.py 2>&1 | tee /tmp/$PREFIX-out/$PREFIX-predicate-env-negtests.log
          python3 test-cert-positive-guard.py 2>&1 | tee /tmp/$PREFIX-out/$PREFIX-certpos-guard-negtests.log
          python3 test-k2-sweeps.py 2>&1 | tee /tmp/$PREFIX-out/$PREFIX-k2-sweeps-negtests.log
          python3 test-stale-state-committed.py 2>&1 | tee /tmp/$PREFIX-out/$PREFIX-stale-state-negtests.log
          python3 test-heredoc-structure.py 2>&1 | tee /tmp/$PREFIX-out/$PREFIX-heredoc-structure-negtests.log
          python3 test-h5-planted-errset.py 2>&1 | tee /tmp/$PREFIX-out/$PREFIX-h5-planted-errset-tests.log
          python3 test-inrun-writes.py 2>&1 | tee /tmp/$PREFIX-out/$PREFIX-inrun-writes-negtests.log
          python3 test-inrun-stale-path.py 2>&1 | tee /tmp/$PREFIX-out/$PREFIX-inrun-stale-path-negtests.log

      - name: NON_CERTIFYING_REHEARSAL reproducible OVMF DEBUG dual build + accepted-firmware pins
        timeout-minutes: 150
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          ./build-ovmf-debug.sh /tmp/$PREFIX-stage /tmp/$PREFIX-ovmf-a /tmp/$PREFIX-ovmf-b
          cmp /tmp/$PREFIX-ovmf-a/OVMF_CODE.fd /tmp/$PREFIX-ovmf-b/OVMF_CODE.fd
          cmp /tmp/$PREFIX-ovmf-a/OVMF_VARS.fd /tmp/$PREFIX-ovmf-b/OVMF_VARS.fd
          echo "dual OVMF build byte-identical (canonical path /build)"
          # batch1r3 C6: the runner-1 FD raw scan is REMOVED (non-evidentiary); the
          # module-level condition-5 parse runs in env2 over the preserved Build tree.
          # hard gates: the accepted firmware is exactly these bytes (hash AND size)
          HC=$(sha256sum /tmp/$PREFIX-ovmf-a/OVMF_CODE.fd | cut -d' ' -f1)
          [ "$HC" = "fc150336fce10eb5508fa440cdf7300622c8c3ac71f2fbe10a0731422b9cef24" ] || { echo "E_CODE_PIN_MISMATCH $HC"; exit 95; }
          [ "$(stat -c%s /tmp/$PREFIX-ovmf-a/OVMF_CODE.fd)" = "3653632" ] || { echo "E_CODE_PIN_SIZE"; exit 95; }
          HV=$(sha256sum /tmp/$PREFIX-ovmf-a/OVMF_VARS.fd | cut -d' ' -f1)
          [ "$HV" = "5d2ac383371b408398accee7ec27c8c09ea5b74a0de0ceea6513388b15be5d1e" ] || { echo "E_VARS_PIN_MISMATCH $HV"; exit 95; }
          [ "$(stat -c%s /tmp/$PREFIX-ovmf-a/OVMF_VARS.fd)" = "540672" ] || { echo "E_VARS_PIN_SIZE"; exit 95; }
          sha256sum /tmp/$PREFIX-ovmf-a/OVMF_CODE.fd /tmp/$PREFIX-ovmf-a/OVMF_VARS.fd \
            > /tmp/$PREFIX-fw-hashes.txt
          cat /tmp/$PREFIX-fw-hashes.txt
      - name: NON_CERTIFYING_REHEARSAL hostile-path drift demonstration (condition 5)
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          # deliberately NON-canonical host path: the PDB-path verifier MUST reject it.
          # fail-closed: require exit EXACTLY 43 from the scan of the preserved hostile
          # module tree, EVERY scanned module carrying the hostile path, and real drift.
          CANON_MODE=hostile CANON_REALWORK=/var/tmp/$PREFIX-hostile-work \
            ./build-ovmf-debug.sh /tmp/$PREFIX-stage /tmp/$PREFIX-hostile-out
          set +e
          SCAN_OUT=$(python3 scan-pe-pdb-paths.py /var/tmp/$PREFIX-hostile-work/edk2/Build /build/ 2>&1)
          RC=$?
          set -e
          echo "$SCAN_OUT"
          [ "$RC" = "43" ] || { echo "E_HOSTILE_NOT_REJECTED rc=$RC (must be exactly 43; PASS, crash, missing tree or vacuous 45 all fail closed)"; exit 92; }
          MODS=$(printf '%s\n' "$SCAN_OUT" | sed -n 's/^scanned \([0-9][0-9]*\) PE files.*/\1/p')
          BAD=$(printf '%s\n' "$SCAN_OUT" | sed -n 's/^VERDICT: REJECT (\([0-9][0-9]*\) of [0-9][0-9]* modules.*/\1/p')
          [ -n "$MODS" ] && [ "$MODS" -gt 0 ] || { echo "E_HOSTILE_VACUOUS modules='$MODS'"; exit 92; }
          [ "$BAD" = "$MODS" ] || { echo "E_HOSTILE_PARTIAL_REJECT bad=$BAD modules=$MODS (every module must carry the hostile path)"; exit 92; }
          HH=$(sha256sum /tmp/$PREFIX-hostile-out/OVMF_CODE.fd | cut -d' ' -f1)
          [ "$HH" != "fc150336fce10eb5508fa440cdf7300622c8c3ac71f2fbe10a0731422b9cef24" ] || { echo "E_HOSTILE_NO_DRIFT: hostile build equals the accepted firmware"; exit 92; }
          echo "hostile-path build REJECTED: all $MODS modules carry the hostile path (exit exactly 43); drift confirmed $HH"
          sha256sum /tmp/$PREFIX-hostile-out/OVMF_CODE.fd >> /tmp/$PREFIX-fw-hashes.txt
      - name: NON_CERTIFYING_REHEARSAL network-cut canary (must fail)
        run: |
          set -euo pipefail
          # batch1r3 C3: a fetch inside the cut namespace MUST fail, proving the cut is real
          if sudo unshare -n curl -fsS --max-time 10 https://archive.ubuntu.com/ >/dev/null 2>&1; then
            echo "E_NET_CANARY_LEAK: network reachable inside unshare -n"; exit 96
          fi
          echo "network-cut canary failed as required"
      - name: NON_CERTIFYING_REHEARSAL enrollment app + ESP dual builds (network-enforced-off)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          # batch1r3 C3: both builders run with the network enforced off; all inputs are staged
          sudo unshare -n ./build-enroll-app.sh /tmp/$PREFIX-stage /tmp/$PREFIX-app-a /tmp/$PREFIX-app-b
          cmp /tmp/$PREFIX-app-a/enroll-app.efi /tmp/$PREFIX-app-b/enroll-app.efi
          sha256sum /tmp/$PREFIX-app-a/enroll-app.efi >> /tmp/$PREFIX-fw-hashes.txt
          # batch1r3 C1: the ESP step runs with the staged-loader shims on PATH
          export PATH="/tmp/$PREFIX-stage/shims:$PATH"
          sudo unshare -n env PATH="$PATH" ../build-esp-image.sh evidence/successor-signed.efi /tmp/$PREFIX-esp-a
          sudo unshare -n env PATH="$PATH" ../build-esp-image.sh evidence/successor-signed.efi /tmp/$PREFIX-esp-b
          [ "$(sha256sum /tmp/$PREFIX-esp-a/c5-root-admitter-uki-v3-esp.raw | cut -d' ' -f1)" = \
            "2bfa621238890890765c9636f99dabfb46233bfa626afb580ce33e65858019c9" ]
          cmp /tmp/$PREFIX-esp-a/c5-root-admitter-uki-v3-esp.raw /tmp/$PREFIX-esp-b/c5-root-admitter-uki-v3-esp.raw
          # peer gap close: the ESP is a frozen output; record it in fw-hashes for the
          # env2 cross-runner comparison, and log the artifact digest tied to this run.
          sha256sum /tmp/$PREFIX-esp-a/c5-root-admitter-uki-v3-esp.raw >> /tmp/$PREFIX-fw-hashes.txt
          echo "ARTIFACT-DIGEST path=/tmp/$PREFIX-fw-hashes.txt sha256=$(sha256sum /tmp/$PREFIX-fw-hashes.txt | cut -d' ' -f1) run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT run_number=$GITHUB_RUN_NUMBER workflow=$GITHUB_WORKFLOW commit=$GITHUB_SHA ref=$GITHUB_REF"
      - name: NON_CERTIFYING_REHEARSAL unsigned UKI in-run build (reviewed gapless builder)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -eEuo pipefail
          trap '_rc=$?; echo "E_BASH_ERRTRAP uki-build line $LINENO rc=$_rc cmd: $BASH_COMMAND" >&2; exit 97' ERR
          # peer 2026-09-24 route-(ii): the unsigned UKI is built IN-RUN by the committed
          # reviewed builder (successor-uki-candidate/build-successor-gapless.py), never
          # committed; the output MUST equal 4cda9c3e.. or this step dies named. This exact
          # file is the later owner signing packet's input, reproducible from committed inputs.
          cd docs/verified-architecture-phase2-v3
          sudo unshare -n env PATH="$PATH" PREFIX="$PREFIX" bash -se <<'UKIB'
          set -eEuo pipefail
          trap '_rc=$?; echo "E_BASH_ERRTRAP uki-build-inner line $LINENO rc=$_rc cmd: $BASH_COMMAND" >&2; exit 97' ERR
          rm -rf "/tmp/$PREFIX-uki"; mkdir -p "/tmp/$PREFIX-uki"
          python3 successor-uki-candidate/build-successor-gapless.py . "/tmp/$PREFIX-uki/successor-unsigned.efi"
          got=$(sha256sum "/tmp/$PREFIX-uki/successor-unsigned.efi" | cut -d' ' -f1)
          [ "$got" = "4cda9c3e285b5b639364234400bf0b121178f12447cc88d896cd2623e07d18e1" ] || { echo "E_UNSIGNED_UKI_DRIFT got=$got"; exit 91; }
          echo "unsigned UKI in-run build == 4cda9c3e (E_UNSIGNED_UKI_DRIFT gate clean)"
          UKIB
          mkdir -p "/tmp/$PREFIX-inrun/uki"
          cp "/tmp/$PREFIX-uki/successor-unsigned.efi" "/tmp/$PREFIX-inrun/uki/successor-unsigned.efi"
      - name: NON_CERTIFYING_REHEARSAL criterion-C throwaway signing (c-sign, ephemeral in-run key)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set -eEuo pipefail
          trap '_rc=$?; echo "E_BASH_ERRTRAP c-sign line $LINENO rc=$_rc cmd: $BASH_COMMAND" >&2; exit 97' ERR
          cd docs/verified-architecture-phase2-v3/provisioning/p3/rehearsal
          export PATH="/tmp/$PREFIX-stage/shims:$PATH"
          [ -x "/tmp/$PREFIX-stage/shims/osslsigncode" ] || { echo "E_TOOL_MISSING osslsigncode shim"; exit 92; }
          [ -x "/tmp/$PREFIX-stage/shims/sbsign" ] || { echo "E_TOOL_MISSING sbsign shim"; exit 92; }
          [ -x "/tmp/$PREFIX-stage/shims/openssl" ] || { echo "E_TOOL_MISSING openssl shim"; exit 92; }
          C=/tmp/$PREFIX-inrun/c-sign
          rm -rf "$C"; mkdir -p "$C"
          # network-enforced-off like every other post-staging build step (batch1r3 C3);
          # the inner body runs as root solely for the namespace, then ownership is repaired.
          sudo unshare -n env PATH="$PATH" PREFIX="$PREFIX" C="$C" bash -se <<'CSIGN'
          set -eEuo pipefail
          trap '_rc=$?; echo "E_BASH_ERRTRAP c-sign-inner line $LINENO rc=$_rc cmd: $BASH_COMMAND" >&2; exit 97' ERR
          # zero-private-key rule: the ephemeral signing key exists ONLY at
          # /tmp/$PREFIX-csign-key/ (mode 0700, outside the checkout and every upload
          # path) and is shred -u'd by an in-step shell trap on EVERY exit path,
          # including job cancellation (peer hardening note: on cancellation only in-step
          # traps are guaranteed; never an always() cleanup step), plus an explicit
          # shred -u after the gates. The key is never committed, never uploaded,
          # never printed.
          K=/tmp/$PREFIX-csign-key
          mkdir -p "$K"; chmod 0700 "$K"
          trap 'shred -u "$K/throwaway-key.pem" 2>/dev/null || true; rmdir "$K" 2>/dev/null || true' EXIT
          U=/tmp/$PREFIX-inrun/uki/successor-unsigned.efi
          got=$(sha256sum "$U" | cut -d' ' -f1)
          [ "$got" = "4cda9c3e285b5b639364234400bf0b121178f12447cc88d896cd2623e07d18e1" ] || { echo "E_UNSIGNED_UKI_DRIFT got=$got"; exit 91; }
          openssl req -x509 -newkey rsa:2048 -keyout "$K/throwaway-key.pem" -out "$C/c5-throwaway-ci-cert.pem" -days 1 -nodes -subj "/CN=C5-THROWAWAY-CI-SIGNER/" -sha256
          openssl x509 -in "$C/c5-throwaway-ci-cert.pem" -outform DER -out "$C/c5-throwaway-ci-cert.der"
          # arm 1: osslsigncode (PE Authenticode attach); arm 2: sbsign
