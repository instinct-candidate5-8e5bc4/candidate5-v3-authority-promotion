name: V3 Structural Enforcement Preflight (design only - non-authorizing)
on:
  push:
    branches: [candidate5-structural-enforcement-preflight]
  pull_request:
    paths:
      - docs/verified-architecture-phase2-v3/structural-enforcement-preflight.md
      - docs/verified-architecture-phase2-v3/offline-secure-boot-signing-ceremony/**
      - .github/workflows/v3-structural-enforcement-preflight.yml
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Certified baseline and immutable Foundation
        shell: bash
        run: |
          set -euo pipefail
          base=127f284d78b83f358f076b3ee8f8b56044bcc691
          git merge-base --is-ancestor "$base" HEAD
          paths=(
            src/clean-runtime/mutation/physical-capability-router.js
            src/clean-runtime/mutation/physical-proof-planner.js
            src/clean-runtime/mutation/v3-authority-adapter.js
            src/clean-runtime/mutation/v3-promotion-foundation.js
            src/clean-runtime/v3-authority/authority-envelope-builder.js
            src/clean-runtime/v3-authority/authority-envelope.js
          )
          git diff --exit-code "$base" -- "${paths[@]}"
          test "$(git rev-parse HEAD:"${paths[0]}")" = 4acc0ea42557c226b4c4ea0d162f787f46fb753e
          test "$(git rev-parse HEAD:"${paths[1]}")" = f2bacae79bbb476222f683fa74bda85daeef1629
          test "$(git rev-parse HEAD:"${paths[2]}")" = 4ef9f013fa1cc15ea2898fd39ca00dafa4c17879
          test "$(git rev-parse HEAD:"${paths[3]}")" = c09f5e2c6dac357b1a0b3d660dcc1b73c9dc04bc
          test "$(git rev-parse HEAD:"${paths[4]}")" = 19f5f180b2253dbda45401542153471ab3ce5c45
          test "$(git rev-parse HEAD:"${paths[5]}")" = 5766c26d5deacd2b92a231c9a341e636ff97e392
      - name: Preflight completeness
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/verified-architecture-phase2-v3/structural-enforcement-preflight.md
          test -s "$doc"
          for heading in \
            '## Decision' '## Exact trust boundaries' '## Threat model' \
            '## Prerequisite certified boundary-policy baseline' \
            '## Implementation choice' '## Mandatory hostile proof strategy' \
            '## Node and Web compatibility' '## Deterministic build strategy' \
            '## Evidence plan'; do
            grep -Fqx "$heading" "$doc"
          done
          grep -Fq '127f284d78b83f358f076b3ee8f8b56044bcc691' "$doc"
          grep -Fq 'BOUNDARY_POLICY_ARTIFACT_COMMIT' "$doc"
          grep -Fq 'BOUNDARY_POLICY_CERTIFICATION_COMMIT' "$doc"
          grep -Fq 'structural-boundary-policy-guard' "$doc"
          grep -Fq 'GitHub Free, repository refs, merge state, branch settings and GitHub Actions are untrusted' "$doc"
          grep -Fq 'NO PAID GITHUB PLAN DEPENDENCY' "$doc"
          grep -Fq 'GitHub Team/Enterprise' "$doc"
          grep -Fq 'CERTIFICATION_VALID' "$doc"
          grep -Fq 'otherwise NOT_AUTHORIZED' "$doc"
          grep -Fq 'Governance-independence hostile proofs' "$doc"
          grep -Fq 'This design chooses reduced guarantee A' "$doc"
          grep -Fq 'Core property: "Compromise or bypass of GitHub repository governance' "$doc"
          grep -Fq 'V3RUNTIMEUPDATE:v2' "$doc"
          grep -Fq 'V3UPDATEHEALTH:v1' "$doc"
          grep -Fq 'V3KEYRECOVERY:v1' "$doc"
          grep -Fq '1ff82930ec3120b7d1e8af51d0873b8fd5bd1d2a585f1611cf549516639fda36' "$doc"
          grep -Fq '33c413bd5b3bf2908a27659e76e1aec48a31af80dc41cd8e92e37e3ef0675015' "$doc"
          grep -Fq 'ad5d42280aab2bd983fd5c644b53194c5b4eaf2d31e1272fcbf8f90057ee3928' "$doc"
          grep -Fq 'successor self-attestation' "$doc"
          grep -Fq 'Crash-consistent transition table' "$doc"
          grep -Fq 'successor floors/keys inert' "$doc"
          grep -Fq 'CROSS_DOMAIN' "$doc"
          grep -Fq 'Canonical bound positive vectors' "$doc"
          grep -Fq 'ROLLBACK/RECOVERY' "$doc"
          grep -Fq 'Privileged host/OS/bootstrap compromise is out of scope' "$doc"
          grep -Fq 'NO PAID GITHUB PLAN DEPENDENCY' "$doc"
          grep -Fq 'admin disables checks' "$doc"
          grep -Fq 'signature signs `text("V3CERT:v3")' "$doc"
          grep -Fq 'Missing, stale, malformed, unsigned' "$doc"
          grep -Fq 'but not `certification.sig`' "$doc"
          grep -Fq 'git rev-parse artifact^1 == sourceCommit' "$doc"
          grep -Fq 'V3BOUNDARYPINS:v1' "$doc"
          grep -Fq 'V3REVOCATION:v2' "$doc"
          grep -Fq 'marker bytes (286 bytes)' "$doc"
          grep -Fq 'are 687 UTF-8 bytes' "$doc"
          grep -Fq 'RFC 8785/JCS is the sole byte-order rule' "$doc"
          grep -Fq 'substituted bytes with raw20 zero tree (276 bytes)' "$doc"
          grep -Fq 'Max checkpoint age is 5 minutes' "$doc"
          grep -Fq 'are currently `UNASSIGNED`' "$doc"
          grep -Fq 'implementation is blocked' "$doc"
          grep -Fq '@endo/module-source@1.5.0' "$doc"
          grep -Fq '@endo/compartment-mapper@2.4.0' "$doc"
          grep -Fq 'ses@2.3.0' "$doc"
          grep -Fq 'V3GRAPH:HEADER:v1' "$doc"
          grep -Fq 'V3POLICY:HEADER:v1' "$doc"
          grep -Fq 'V3BUNDLE:HEADER:v1' "$doc"
          grep -Fq '"releaseSha256Hex": "b7b9da67513ac475832bb37f94e1f8151a76c9610180d3ee97d7e5f1bdc0866f"' "$doc"
          grep -Fq '"graphArtifactHex"' "$doc"
          grep -Fq '"policyArtifactHex"' "$doc"
          grep -Fq '"bundleArtifactHex"' "$doc"
          grep -Fq '"V3AUDIT"' "$doc"
          grep -Fq 'CERTIFICATION_CYCLE_FORBIDDEN' "$doc"
          grep -Fq 'promoted-legality-port.js -> physical-proof-planner.js' "$doc"
          grep -Fq 'promoted-legality-port.js -> v3-promotion-foundation.js' "$doc"
          grep -Fq 'promoted-legality-port.js -> authority-envelope-builder.js' "$doc"
          grep -Fq 'CommonJS `arguments[1]`' "$doc"
          grep -Fq '`Object.values(arguments)`' "$doc"
          grep -Fq 'constructed strings for `constructor`, `process`, `getBuiltinModule`, and `createRequire`' "$doc"
      - name: Retired Windows ceremony entrypoints are inert
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/verified-architecture-phase2-v3/offline-secure-boot-signing-ceremony/assert-retired-state.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.10.12'}
      - name: Successor UKI exact-head static reproduction
        shell: bash
        run: |
          set -euo pipefail
          c=docs/verified-architecture-phase2-v3/successor-uki-candidate
          python3 "$c/verify-candidate.py"
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.10.12
          rm -rf /tmp/successor-a /tmp/successor-b
          python3 "$c/build-successor.py" /tmp/successor-a
          python3 "$c/build-successor.py" /tmp/successor-b
          for f in successor-initramfs.cpio successor-unsigned.efi inventory.v1.json successor-authority-record.v1.json; do
            cmp "/tmp/successor-a/$f" "/tmp/successor-b/$f"
            cmp "/tmp/successor-a/$f" "$c/$f"
          done
          python3 "$c/verify-candidate.py"
      - name: Existing Foundation focused twice
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/clean-runtime/v3-*.test.js
          node --test tests/clean-runtime/v3-*.test.js
      - name: Existing broad regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test $(find tests -name '*.test.js' -print | sort)
      - name: Existing baseline static and audit witness (not future implementation acceptance)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/verified-architecture-phase2/static-boundaries.test.js
          node tests/clean-runtime/v3-promotion-authority-audit.js
