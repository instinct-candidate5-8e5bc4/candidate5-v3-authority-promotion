name: V3 Windows PowerShell 5.1 compatibility proof

# Bounded disposable compatibility proof for the v7 production signing package. MANUAL DISPATCH ONLY,
# and only after static ACCEPT of the exact reviewed commit. The operator enters the reviewed commit,
# reviewed package SHA-256 and byte size (from the accepted review) as dispatch inputs: the run first
# enforces HEAD == reviewed commit, verifies the committed zip byte-for-byte against those values,
# then compares every extracted member byte-for-byte against the CANONICAL COMMITTED BLOB at the
# reviewed HEAD (never the working tree), and executes the proof ONLY against the extracted, verified
# bytes - never against mutable or checkout-transformed content.
# Read-only checkout, no persisted credentials, no caches, no artifact upload, no unrelated network or
# writes. Everything runs under powershell.exe (Windows PowerShell 5.1) with disposable fixture keys
# exclusively. Two if:always() cleanup steps fail the job on any remnant; a controlled premature
# failure right after fixture key creation proves the always-cleanup works on a real leftover. The
# run log is the transcript: env facts, hashes, public disposable identifiers, PASS/STOP states only -
# never a PFX, password, private key, or production material.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Reviewed commit SHA (full 40-hex) that this run must bind to'
        required: true
        type: string
      expected_package_sha256:
        description: 'Reviewed SHA-256 of package/V3-PRODUCTION-SIGNING-PACKAGE-v7.zip (from the accepted static review)'
        required: true
        type: string
      expected_package_size:
        description: 'Reviewed byte size of package/V3-PRODUCTION-SIGNING-PACKAGE-v7.zip'
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: windows-latest
    steps:
      - name: Checkout (read-only, no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify and extract the reviewed package
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ci/V3-VerifyPackage.ps1 -ExpectedCommit "${{ inputs.expected_commit }}" -ExpectedSha "${{ inputs.expected_package_sha256 }}" -ExpectedSize ${{ inputs.expected_package_size }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Controlled early-failure exercise (proves always-cleanup on a real leftover)
        shell: powershell
        run: |
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\v3-pkg\ci\V3-WindowsCompatProof.ps1" -PkgRoot "$env:RUNNER_TEMP\v3-pkg" -SimulateFailureAfterKeyCreation 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { Write-Host 'STOP E_TEST - controlled-failure run unexpectedly succeeded'; exit 1 }
          if ($out -notmatch 'STOP E_CONTROLLED_FAILURE') { Write-Host 'STOP E_TEST - controlled failure did not produce the expected STOP'; exit 1 }
          Write-Host 'CONTROLLED FAILURE EXERCISE PASS - premature stop after fixture key creation occurred as designed; only the always-cleanup can remove the leftover.'

      - name: Always-cleanup after the controlled failure
        if: always()
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ci/V3-WindowsCompatCleanup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full compatibility proof under Windows PowerShell 5.1 (three cleanup lifetimes)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\v3-pkg\ci\V3-WindowsCompatProof.ps1" -PkgRoot "$env:RUNNER_TEMP\v3-pkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guaranteed final cleanup and absence verification
        if: always()
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ci/V3-WindowsCompatCleanup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
