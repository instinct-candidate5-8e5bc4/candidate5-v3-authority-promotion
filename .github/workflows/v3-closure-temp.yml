name: V3 closure temp
on: [push]
jobs:
  test:
    if: github.ref == 'refs/heads/chatgpt/v3-surface-containment-opening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: focused
        shell: bash
        run: |
          set -o pipefail
          node --test tests/verified-architecture-phase2-v3/*.test.js | tee focused.tap
      - name: broad
        if: always()
        shell: bash
        run: |
          set -o pipefail
          files=$(find tests -name '*.test.js' -print | sort | tr '\n' ' ')
          node --test $files | tee broad.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-closure-temp-${{ github.sha }}
          path: |
            focused.tap
            broad.tap
