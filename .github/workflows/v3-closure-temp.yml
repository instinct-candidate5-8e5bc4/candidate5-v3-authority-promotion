name: V3 closure temp
on: [push]
jobs:
  test:
    if: github.ref == 'refs/heads/candidate5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: focused twice detached processes
        shell: bash
        run: |
          set -o pipefail
          node --test tests/verified-architecture-phase2-v3/*.test.js > "$RUNNER_TEMP/focused-1.tap"
          node --test tests/verified-architecture-phase2-v3/*.test.js > "$RUNNER_TEMP/focused-2.tap"
      - name: deterministic evidence
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/review-evidence"; mkdir -p "$OUT"
          node tools/verified-architecture-phase2-v3/closure-evidence.js determinism > "$OUT/determinism-1.json"
          node tools/verified-architecture-phase2-v3/closure-evidence.js determinism > "$OUT/determinism-2.json"
          cmp "$OUT/determinism-1.json" "$OUT/determinism-2.json"
          sha256sum "$OUT"/determinism-*.json > "$OUT/determinism.sha256"
          node tools/verified-architecture-phase2-v3/closure-evidence.js performance > "$OUT/performance.json"
      - name: broad exact command
        if: always()
        shell: bash
        run: |
          set -o pipefail
          files=$(find tests -name '*.test.js' -print | sort | tr '\n' ' ')
          node --test $files > "$RUNNER_TEMP/broad.tap"
      - name: static boundaries debt exact result
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/review-evidence"; mkdir -p "$OUT"; set +e
          node --test tests/verified-architecture-phase2/static-boundaries.test.js > "$OUT/static-boundaries.tap" 2>&1
          code=$?; echo $code > "$OUT/static-boundaries.exit"
          if [ $code -ne 0 ]; then echo COMPATIBILITY_DEBT_PENDING_AUTHORITY_PROMOTION_REVIEW > "$OUT/static-boundaries.debt"; fi
          exit 0
      - name: review metadata and authority audit
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/review-evidence"; mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/commit.txt"; git rev-parse HEAD^ > "$OUT/parent.txt"
          git rev-list --left-right --count 1f1985ea0f37a8a82eb39efa9e28f2794fa5e667...HEAD > "$OUT/rev-list.txt"
          git diff --name-status 1f1985ea0f37a8a82eb39efa9e28f2794fa5e667...HEAD > "$OUT/diff-name-status.txt"
          git diff --numstat 1f1985ea0f37a8a82eb39efa9e28f2794fa5e667...HEAD > "$OUT/diff-numstat.txt"
          git status --porcelain=v1 > "$OUT/review-worktree-status.txt"
          remote=$(git ls-remote origin refs/heads/candidate5 | awk '{print $1}'); echo "$remote" > "$OUT/remote-tip.txt"; test "$remote" = "$(git rev-parse HEAD)"
          git fetch --depth=1 https://github.com/yuzok101/ko-rishon-first-aid-simulator.git main && test "$(git rev-parse FETCH_HEAD)" = "4e06f74a058f10c0be229dabfedf2015cb350e69" && git worktree add --detach "$RUNNER_TEMP/main-worktree" FETCH_HEAD >/dev/null
          git -C "$RUNNER_TEMP/main-worktree" status --porcelain=v1 > "$OUT/main-worktree-status.txt"
          {
            echo 'gatewayRouted=false'; echo 'legalityPromoted=false'
            echo -n 'runtime_imports_v3_legality='; grep -R -l "verified-architecture-phase2-v3/\|phase2-v3" src/runtime src 2>/dev/null | grep -v 'src/verified-architecture-phase2-v3' | wc -l || true
            echo -n 'renderer_three_imports_in_v3='; grep -R -E "require\(['\"]three|from ['\"]three|renderer" src/verified-architecture-phase2-v3 2>/dev/null | wc -l || true
            echo -n 'candidate_evaluator_entry='; grep -R -l "function evaluateV3" src/verified-architecture-phase2-v3/evaluate.js | wc -l
          } > "$OUT/authority-audit.txt"
          cp "$RUNNER_TEMP/focused-1.tap" "$RUNNER_TEMP/focused-2.tap" "$RUNNER_TEMP/broad.tap" "$OUT/" 2>/dev/null || true
          tar --exclude=.git -czf "$OUT/candidate.tar.gz" .
          sha256sum "$OUT/candidate.tar.gz" > "$OUT/candidate.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-closure-review-${{ github.sha }}
          path: ${{ runner.temp }}/review-evidence
